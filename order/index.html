function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rid(){var s='',c='abcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<12;i++)s+=c.charAt(Math.floor(Math.random()*36));return s}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){d=d||new Date();return String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())}
function ago(t){var m=Math.floor((Date.now()-t)/60000);if(m<1)return 'vừa xong';if(m<60)return m+' phút trước';var h=Math.floor(m/60);if(h<24)return h+' giờ trước';return pad(new Date(t).getDate())+'/'+pad(new Date(t).getMonth()+1)}
function hhmm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}

/* ====== KẾT NỐI SUPABASE (bảng docs, loại "sd") ====== */
function rq(method,path,body,extra){
 var h={apikey:SB.key,'Content-Type':'application/json'};if(/^eyJ/.test(SB.key))h.Authorization='Bearer '+SB.key;
 if(extra)for(var k in extra)h[k]=extra[k];
 return fetch(SB.url+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
  if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+String(t).slice(0,120))});
  if(r.status===204)return null;var ct=r.headers.get('content-type')||'';return ct.indexOf('json')>-1?r.json():r.text()})}
function save(o){return rq('POST','docs?on_conflict=id',[{id:'sd:'+o.rid,kind:'sd',data:o}],{Prefer:'resolution=merge-duplicates,return=minimal'})}
function nextCode(){return rq('POST','rpc/next_block',{d:'sd'+ymd(),k:1}).then(function(n){return typeof n==='number'?'DH'+ymd()+'-'+('00'+n).slice(-3):rnd()}).catch(rnd)}
function rnd(){return 'DH'+ymd()+'-'+('00'+Math.floor(Math.random()*900+100)).slice(-3)}

function fee(km){km=+km||0;if(km<=CFG.km0)return CFG.fee0;return CFG.fee0+Math.ceil(km-CFG.km0)*CFG.feeKm}
function setQ(id,d){var q=Math.max(0,Math.min(99,(CART[id]||0)+d));if(q)CART[id]=q;else delete CART[id];cartSave();menuUpdate()}

 f.name=(f.name||'').trim();f.phone=(f.phone||'').trim();f.addr=(f.addr||'').trim();f.note=(f.note||'').trim();

var STEPS=['Chờ quán xác nhận','Quán đang làm món','Đang giao đến bạn','Đã giao xong'],SIDX={new:0,cook:1,ship:2,done:3};

function ring(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;OW.ctx=OW.ctx||new C();var c=OW.ctx;if(c.state==='suspended')c.resume();[660,880,660].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.0001;o.connect(g);g.connect(c.destination);var t=c.currentTime+i*.22;g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)});if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}

 var q='docs?kind=eq.sd&select=id,data,updated_at&order=updated_at.asc&limit=500&updated_at=gt.'+encodeURIComponent(OW.cursor?iso(new Date(OW.cursor.slice(0,23)+'Z').getTime()-2500):iso(Date.now()-3*86400000));

  var st=$('#ostat'),dt=$('#odot');if(st)st.textContent='Đang nhận đơn trực tiếp';if(dt)dt.className='dot live';

  OW.first=false;owRender()
 }).catch(function(){OW.live=false;var st=$('#ostat'),dt=$('#odot');if(st)st.textContent='Mất kết nối, đang thử lại…';if(dt)dt.className='dot bad'})}
function startOfDay(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function owRender(){
 var all=[];for(var k in OW.orders)all.push(OW.orders[k]);all.sort(function(a,b){return b.t-a.t});
 var today=all.filter(function(o){return o.t>=startOfDay()&&o.status!=='cancel'}),rev=0;today.forEach(function(o){rev+=o.tot});
 var by={new:[],cook:[],ship:[],done:[]};all.forEach(function(o){if(by[o.status])by[o.status].push(o)});
 by.done=by.done.filter(function(o){return o.t>=startOfDay()});
 var T=[['new','Mới'],['cook','Đang làm'],['ship','Đang giao'],['done','Xong hôm nay']];
 var tb=$('#otabs');if(tb)tb.innerHTML=T.map(function(t){var n=by[t[0]].length;return '<button class="tab'+(OW.tab===t[0]?' on':'')+'" onclick="AO.tab(\''+t[0]+'\')">'+t[1]+(n&&t[0]!=='done'?' <em>'+n+'</em>':'')+'</button>'}).join('');
 var sm=$('#osum');if(sm)sm.textContent='Hôm nay: '+today.length+' đơn · '+money(rev);
 var L=by[OW.tab]||[],ls=$('#olist');
 var nc=newCount();document.title=nc?'('+nc+') Đơn mới – Hòa Lạc':'Đơn hàng – Hòa Lạc';
 if(!ls)return;
 ls.innerHTML=L.length?L.map(card).join(''):'<div class="empty" style="grid-column:1/-1"><b>'+(OW.tab==='new'?'Chưa có đơn mới':'Không có đơn ở mục này')+'</b>'+(OW.tab==='new'?'Đơn khách đặt sẽ hiện ở đây và kêu chuông.<br>Hãy để màn hình này mở.':'')+'</div>'}
function card(o){
 var cod=o.pay==='cod',acts='';
 if(o.status==='new')acts='<div class="oacts two2"><button class="btn green" onclick="AO.set(\''+o.rid+'\',\'cook\')">✓ Nhận đơn</button><button class="btn red sm" style="min-height:54px" onclick="AO.rej(\''+o.rid+'\')">Từ chối</button></div>';
 else if(o.status==='cook')acts='<div class="oacts"><button class="btn" onclick="AO.set(\''+o.rid+'\',\'ship\')">🛵 Giao đi</button></div>';
 else if(o.status==='ship')acts='<div class="oacts"><button class="btn green" onclick="AO.set(\''+o.rid+'\',\'done\')">✓ Giao xong</button></div>';
 var map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.cust.addr+', Hòa Lạc');
 return '<article class="oc s-'+o.status+'"><div class="h"><span class="code">'+esc(o.code)+'</span>'+(o.status==='new'?'<span class="tag new">MỚI</span>':'')+'<span class="tag '+(cod?'cod':'bank')+'">'+(cod?'💵 Thu tiền mặt':'🏦 Chuyển khoản')+'</span><span class="ago">'+hhmm(o.t)+' · '+ago(o.t)+'</span></div>'
 +'<div class="who"><b>'+esc(o.cust.name)+'</b><a class="call2" href="tel:'+digits(o.cust.phone)+'">📞 '+esc(fmtPhone(o.cust.phone))+'</a></div>'
 +'<div class="addr"><p>📍 '+esc(o.cust.addr)+'</p><div class="acts2"><button class="mini" onclick="AO.copy(\''+o.rid+'\')">Sao chép địa chỉ</button><a class="mini" href="'+map+'" target="_blank" rel="noopener">Mở bản đồ</a></div></div>'
 +'<ul class="items">'+o.items.map(function(i){return '<li><span>'+i.q+' × '+esc(i.n)+'</span><b>'+money(i.p*i.q)+'</b></li>'}).join('')+'<li><span style="color:var(--muted)">Phí giao hàng ('+(o.km<=1?'dưới 1':'~'+o.km)+' km)</span><b>'+money(o.fee)+'</b></li></ul>'
 +(o.note?'<div class="note">📝 '+esc(o.note)+'</div>':'')
 +'<div class="otot"><span>'+(cod?'Cần thu':'Khách chuyển')+'<small>'+(cod?'tiền mặt khi giao':'kiểm tra tiền vào tài khoản')+'</small></span><b>'+money(o.tot)+'</b></div>'+acts+'</article>'}
function owSet(id,st){var o=OW.orders[id];if(!o)return;var d=JSON.parse(JSON.stringify(o));d.status=st;d.hist=d.hist||{};d.hist[st]=Date.now();
 save(d).then(function(){OW.orders[id]=d;if(st==='cook')OW.tab='cook';else if(st==='ship')OW.tab='ship';else if(st==='done')OW.tab='done';else if(st==='cancel')OW.tab='new';owRender();toast({cook:'Đã nhận đơn '+d.code,ship:'Đã chuyển sang đang giao',done:'Hoàn tất đơn '+d.code,cancel:'Đã từ chối đơn '+d.code}[st])}).catch(function(){toast('Chưa cập nhật được, kiểm tra mạng','err')})}
function owRej(id){var o=OW.orders[id];if(!o)return;openSheet('<div class="hd"><h2>Từ chối đơn này?</h2><button class="x" onclick="AO.close()" aria-label="Đóng">×</button></div><p class="hint" style="font-size:15px;margin:14px 0">Đơn <b>'+esc(o.code)+'</b> của '+esc(o.cust.name)+'. Khách sẽ thấy đơn bị hủy. Nên gọi báo khách trước.</p><div class="oacts"><button class="btn" style="background:var(--red)" onclick="AO.close();AO.set(\''+id+'\',\'cancel\')">Từ chối đơn</button><button class="btn ghost" onclick="AO.close()">Không, giữ đơn</button></div>')}
function copyAddr(id){var o=OW.orders[id];if(!o)return;var t=o.cust.name+' · '+fmtPhone(o.cust.phone)+' · '+o.cust.addr;
 function ok(){toast('Đã sao chép địa chỉ')}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fallback()})}else fallback();
 function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Không sao chép được','err')}document.body.removeChild(a)}}

/* ====== CỔNG GỌI TỪ HTML ====== */
window.AO={
 q:setQ,cart:function(){cartSheet(false)},close:closeSheet,sec:secGo,
 f:function(k,v){FORM[k]=v;lsSet('ao_form',FORM)},
 tot:function(){var e=$('#ct');if(e)e.innerHTML=totals();var g=$('#cft');if(g)g.textContent=grand()},
 pay:function(p){FORM.pay=p;lsSet('ao_form',FORM);$('#pay').innerHTML=payBtns()},
 send:send,
 pin:function(){var v=($('#pin').value||'').trim();if(v===CFG.pin){lsSet('ao_owner',1);ring();viewOwner()}else{toast('Sai mã PIN','err');$('#pin').value=''}},
 out:function(){lsSet('ao_owner',0);location.hash='#/'},
 snd:function(){var on=lsGet('ao_snd',1)===1;lsSet('ao_snd',on?0:1);sndBtn();if(!on)ring()},
 tab:function(t){OW.tab=t;owRender()},set:owSet,rej:owRej,copy:copyAddr
};
go();
})();
</script>
</body>
</html>
