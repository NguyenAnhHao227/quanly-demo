<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho – Ăn Ngon Hoà Lạc (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;
  --blue:#0a84ff;--blue-d:#0069d9;--blue-soft:#eaf4ff;
  --orange:#ff4d00;--orange-soft:#fff1e8;
  --green:#059669;--green-soft:#e6f7f0;
  --red:#e11d48;--red-soft:#fff0f3;
  --amber:#b45309;--amber-soft:#fff5dc;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)}
.grow{flex:1}

/* ===== top bar (giống hệ thống POS) ===== */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-size:22px}
.brand b{font-size:17px;display:block;line-height:1.2}
.brand small{color:var(--green);font-size:11.5px;font-weight:500;display:flex;gap:4px;align-items:center}
.nav{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:12px;color:var(--ink2);font-weight:500;font-size:15px;white-space:nowrap;cursor:pointer;user-select:none}
.nav a:hover{background:#f1f5f9}
.nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag-new{background:var(--orange);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;letter-spacing:.3px}
.right{display:flex;gap:10px;align-items:center;margin-left:auto}
.notify{background:#ffb48a;color:#fff;border:0;border-radius:12px;padding:8px 12px;font-weight:700;font-size:12px;display:flex;gap:6px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.app{background:#fbbf24;color:#1f1300;border:1px solid #f59e0b;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px}
.usr{text-align:right;line-height:1.2}
.usr b{display:block;font-size:13px}
.usr small{color:var(--muted);font-size:11px}
.shift{border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:8px 12px;font-weight:600;display:flex;gap:6px;align-items:center}

/* ===== layout ===== */
.wrap{max-width:1420px;margin:0 auto;padding:22px 16px 90px}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:24px;display:flex;gap:10px;align-items:center;letter-spacing:-.3px}
.head p{color:var(--muted);font-size:13px}
.demo{background:var(--amber-soft);color:var(--amber);font-weight:700;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid #f6d68a}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.05)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(10,132,255,.25)}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 6px 14px rgba(255,77,0,.22)}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.subtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:thin}
.pill{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pill:hover{border-color:#cbd5e1}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .n{background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;font-weight:800}
.pill.f-blue{background:var(--blue-soft);color:var(--blue);border-color:#b9dcff}
.pill.f-green{background:var(--green-soft);color:var(--green);border-color:#b6ecd4}
.pill.f-red{background:var(--red-soft);color:var(--red);border-color:#fbc3cf}
.pill.f-amber{background:var(--amber-soft);color:var(--amber);border-color:#f6d68a}
.pill.on.f-blue,.pill.on.f-green,.pill.on.f-red,.pill.on.f-amber,.pill.on{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
.pill.on{box-shadow:none}
.pill.blue-on{background:var(--blue);color:#fff;border-color:var(--blue)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--blue);font-weight:700;font-size:12.5px}
.link:hover{text-decoration:underline}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
button.kpi:hover{border-color:#cbd5e1;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.kico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-green{background:var(--green-soft);color:var(--green)}
.t-orange{background:var(--orange-soft);color:var(--orange)}
.klabel{font-size:12.5px;color:var(--muted);font-weight:600}
.kval{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.ksub{font-size:12px;color:var(--muted)}
.kbody{flex:1;min-width:0}

.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.split{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;align-items:start}
@media(max-width:980px){.g2,.split{grid-template-columns:1fr}}

/* chips */
.chip{display:inline-flex;gap:4px;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.low{background:var(--amber-soft);color:var(--amber)}
.chip.out{background:var(--red-soft);color:var(--red)}
.chip.exp{background:var(--orange-soft);color:var(--orange)}
.chip.gray{background:#f1f5f9;color:var(--muted)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}

/* bars */
.bar{height:6px;background:#e8edf3;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.low i{background:#f59e0b}.bar.out i{background:var(--red)}.bar.blue i{background:var(--blue)}.bar.orange i{background:var(--orange)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #eef2f6;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
.r{text-align:right}
.name{background:none;border:0;font-weight:700;text-align:left;color:var(--ink);font-size:14px}
.name:hover{color:var(--blue)}
td small{display:block;color:var(--muted);font-size:12px}
.neg{color:var(--red);font-weight:700}.pos{color:var(--green);font-weight:700}.ok-t{color:var(--muted)}

/* forms */
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
label.l{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.radios input{accent-color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.lrow{display:grid;grid-template-columns:2.2fr 1fr 1.2fr 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.lrow .qty{display:flex;align-items:center;gap:6px}
.lrow .qty span{color:var(--muted);font-size:12px;min-width:26px}
.lsum{padding-top:10px;font-weight:800;text-align:right}
.hint{font-size:11.5px;color:var(--amber);grid-column:1/-1;margin-top:-4px}
.xbtn{width:36px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.xbtn:hover{color:var(--red);border-color:#fbc3cf}
@media(max-width:760px){.lrow{grid-template-columns:1fr 1fr}.lrow>:first-child{grid-column:1/-1}}
.totalbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);margin-top:12px;padding-top:14px}
.totalbar .big{font-size:22px;font-weight:800}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:220px;color:var(--muted)}
.search input{border:0;outline:0;padding:9px 0;width:100%;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}

/* lists */
.alist{display:flex;flex-direction:column}
.arow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f6}
.arow:last-child{border-bottom:0}
.arow .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.arow .tx{flex:1;min-width:0}
.arow .tx b{display:block;font-size:14px}
.arow .tx span{color:var(--muted);font-size:12px}
.hbar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .v{font-weight:700;font-size:12.5px;min-width:56px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 14px;background:#f8fafc;border-radius:12px;font-weight:700}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:19px;font-weight:800}
.tile span{font-size:12px;font-weight:600}

.sup{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sup .card h4{font-size:15px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #e8edf3;font-size:13px}
.kv:last-of-type{border-bottom:0}

.recipe-ing{display:flex;gap:4px;flex-wrap:wrap}
.recipe-ing span{background:#f1f5f9;border-radius:8px;padding:2px 7px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.sim{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sim>div{min-width:150px}
.stepper{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:36px;border:0;background:#f8fafc;font-weight:800;font-size:16px}
.stepper input{width:54px;border:0;text-align:center;outline:0;font-weight:700;padding:8px 0}
.simnote{background:var(--blue-soft);border-radius:12px;padding:10px 14px;color:#0b4f99;font-size:12.5px;margin-top:12px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:100%;max-width:540px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(15,23,42,.3)}
.modal.wide{max-width:680px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:17px}
.mb{padding:18px 20px 20px}
.x{width:34px;height:34px;border-radius:10px;border:0;background:#f1f5f9;display:grid;place-items:center}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;display:flex;gap:10px;align-items:center;font-weight:600;max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 12px 30px rgba(15,23,42,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#34d399}.toast.err svg{color:#fda4af}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tview{animation:fade .2s}

@media(max-width:1180px){.nav{order:3;flex-basis:100%;justify-content:flex-start}}
@media(max-width:700px){.top{padding:10px 16px}.usr,.notify span{display:none}.shift span{display:none}.app{display:none}.head h1{font-size:20px}}
</style>
</head>
<body>

<header class="top" id="top"></header>

<main class="wrap">
  <div class="head">
    <div>
      <h1 id="h1"></h1>
      <p id="stamp"></p>
    </div>
    <span class="demo">BẢN DEMO · DỮ LIỆU MẪU</span>
    <div class="grow"></div>
    <button class="btn btn-ghost" onclick="location.reload()" title="Đưa dữ liệu về như ban đầu">↺ Đặt lại demo</button>
    <button class="btn btn-blue" id="b-in"></button>
    <button class="btn btn-orange" id="b-out"></button>
  </div>
  <nav class="subtabs" id="subtabs" aria-label="Chức năng kho"></nav>
  <section id="view" class="tview"></section>
</main>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

function chipStatus(i){const s=status(i);
 if(s==='out')return '<span class="chip out">Hết hàng</span>';
 if(s==='low')return '<span class="chip low">Sắp hết</span>';
 if(expSoon(i))return '<span class="chip exp">Sắp hết hạn</span>';
 return '<span class="chip ok">Đủ hàng</span>'}

/* ================= TỒN KHO ================= */
function viewStock(){
 const c={all:S.items.length,low:S.items.filter(i=>status(i)==='low').length,out:S.items.filter(i=>status(i)==='out').length,exp:S.items.filter(expSoon).length};
 const P=(k,l,cls)=>`<button class="pill ${cls||''} ${S.sf===k?(cls?'on':'on'):''}" onclick="S.sf='${k}';render()">${l} (${c[k]})</button>`;
 return `<div class="filters">
   ${P('all','Tất cả','')}${P('low','Sắp hết','f-amber')}${P('out','Hết hàng','f-red')}${P('exp','Sắp hết hạn','f-blue')}
   <div class="grow"></div>
   <label class="search" aria-label="Tìm nguyên liệu">${ic('search',16)}<input id="q" placeholder="Tìm nguyên liệu…" value="${esc(S.q)}" oninput="S.q=this.value;renderStockTable()"></label>
   <button class="btn btn-blue" onclick="openAddItem()">${ic('plus',16)} Thêm nguyên liệu</button>
 </div>
 <div class="chips"><button class="pill ${S.sg==='all'?'blue-on':''}" onclick="S.sg='all';render()">Tất cả nhóm</button>${Object.entries(GROUPS).map(([g,n])=>`<button class="pill ${S.sg===g?'blue-on':''}" onclick="S.sg='${g}';render()">${n}</button>`).join('')}</div>
 <div class="card" style="padding:6px 8px"><div class="tw" id="stock-table"></div></div>`}
function renderStockTable(){
 const q=S.q.trim().toLowerCase();
 let rows=S.items.filter(i=>(S.sg==='all'||i.group===S.sg)&&(!q||i.name.toLowerCase().includes(q)));
 if(S.sf==='low')rows=rows.filter(i=>status(i)==='low');if(S.sf==='out')rows=rows.filter(i=>status(i)==='out');if(S.sf==='exp')rows=rows.filter(expSoon);
 const rank={out:0,low:1,ok:2};rows.sort((a,b)=>rank[status(a)]-rank[status(b)]||a.name.localeCompare(b.name,'vi'));
 const sumv=rows.reduce((a,i)=>a+i.stock*i.cost,0);
 $('#stock-table').innerHTML=rows.length?`<table><thead><tr><th>Nguyên liệu</th><th style="min-width:170px">Tồn kho</th><th class="r">Tối thiểu</th><th class="r">Giá vốn BQ</th><th class="r">Giá trị tồn</th><th>Hạn dùng</th><th>Trạng thái</th><th></th></tr></thead><tbody>
 ${rows.map(i=>{const s=status(i),pct=Math.min(100,i.stock/(i.min*2)*100);
  return `<tr><td><button class="name" onclick="openItem(${i.id})">${esc(i.name)}</button><small>${GROUPS[i.group]} · ${esc(supp(i.sup).contact)}</small></td>
  <td><b>${num(i.stock)} ${i.unit}</b><div class="bar ${s}" style="margin-top:5px"><i style="width:${pct}%"></i></div></td>
  <td class="r">${num(i.min)} ${i.unit}</td><td class="r">${money(i.cost)}<small>/${i.unit}</small></td><td class="r"><b>${money(i.stock*i.cost)}</b></td>
  <td>${expText(i)}</td><td>${chipStatus(i)}</td>
  <td class="r"><button class="btn btn-ghost btn-sm" onclick="goIn(${i.id})">${ic('plus',13)} Nhập</button></td></tr>`}).join('')}
 </tbody><tfoot><tr><td colspan="4" class="r muted" style="padding:12px;font-weight:700">Tổng ${rows.length} mặt hàng</td><td class="r" style="padding:12px;font-weight:800">${money(sumv)}</td><td colspan="3"></td></tr></tfoot></table>`:'<div class="empty">Không có nguyên liệu phù hợp bộ lọc</div>'}
function expText(i){if(i.exp==null)return '<span class="muted">—</span>';
 if(i.exp<=0)return '<span class="chip out">Hết hạn</span>';
 if(i.exp<=1)return `<span class="chip exp">Còn ${i.exp} ngày</span>`;
 return `<span class="muted">${i.exp>=60?'Còn '+Math.round(i.exp/30)+' tháng':'Còn '+i.exp+' ngày'}</span>`}

function openItem(id){const i=it(id),rec=S.recipes.filter(r=>r.ing.some(([x])=>x===id)),mv=S.ledger.filter(l=>l.itemId===id).slice(0,6);
 modal(esc(i.name),`
  <div class="tiles"><div class="tile t-blue"><b>${num(i.stock)} ${i.unit}</b><span>Tồn hiện tại</span></div><div class="tile t-green"><b>${money(i.stock*i.cost)}</b><span>Giá trị tồn</span></div></div>
  <div class="kv"><span class="muted">Nhóm</span><b>${GROUPS[i.group]}</b></div>
  <div class="kv"><span class="muted">Giá vốn bình quân</span><b>${money(i.cost)}/${i.unit}</b></div>
  <div class="kv"><span class="muted">Nhà cung cấp</span><b>${esc(supp(i.sup).name)}</b></div>
  <div class="kv"><span class="muted">Hạn dùng</span><span>${expText(i)}</span></div>
  <div class="kv"><span class="muted">Trạng thái</span>${chipStatus(i)}</div>
  <div style="margin-top:14px"><label class="l" for="minv">Định mức tối thiểu (${i.unit}) — dưới mức này hệ thống cảnh báo</label><div style="display:flex;gap:8px"><input id="minv" class="in" type="number" min="0" step="any" value="${i.min}"><button class="btn btn-ghost" onclick="saveMin(${i.id})">Lưu</button></div></div>
  <h4 style="margin:16px 0 6px">Dùng trong món</h4>
  ${rec.length?`<div class="recipe-ing">${rec.map(r=>`<span>${esc(r.name)} · ${num(r.ing.find(([x])=>x===id)[1])} ${i.unit}/phần</span>`).join('')}</div>`:'<p class="muted">Chưa gắn vào công thức nào</p>'}
  <h4 style="margin:16px 0 6px">Biến động gần đây</h4>
  ${mv.length?mv.map(l=>`<div class="kv"><span>${TYPES[l.type][0]} · <span class="muted">${fmtTime(l.t)}</span></span><b class="${l.qty<0?'neg':'pos'}">${l.qty>0?'+':'−'}${num(Math.abs(l.qty))} ${i.unit}</b></div>`).join(''):'<p class="muted">Chưa có biến động</p>'}
  <div class="mact"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button><button class="btn btn-blue" onclick="closeModal();goIn(${i.id})">${ic('down',15)} Nhập hàng</button></div>`)}
function saveMin(id){const v=+$('#minv').value;if(!(v>=0)){toast('Định mức không hợp lệ','err');return}it(id).min=v;closeModal();render();toast('Đã cập nhật định mức tối thiểu')}

function openAddItem(){
 modal('Thêm nguyên liệu mới',`
  <div class="fgrid">
   <div><label class="l" for="n-name">Tên nguyên liệu</label><input id="n-name" class="in" placeholder="VD: Mực ống"></div>
   <div><label class="l" for="n-unit">Đơn vị tính</label><input id="n-unit" class="in" placeholder="kg, lon, chai, gói…"></div>
   <div><label class="l" for="n-group">Nhóm</label><select id="n-group" class="in">${Object.entries(GROUPS).map(([g,n])=>`<option value="${g}">${n}</option>`).join('')}</select></div>
   <div><label class="l" for="n-sup">Nhà cung cấp</label><select id="n-sup" class="in">${S.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
   <div><label class="l" for="n-cost">Giá nhập (đ/đơn vị)</label><input id="n-cost" class="in" type="number" min="0" step="any" placeholder="0"></div>
   <div><label class="l" for="n-min">Định mức tối thiểu</label><input id="n-min" class="in" type="number" min="0" step="any" placeholder="0"></div>
   <div><label class="l" for="n-stock">Tồn đầu kỳ</label><input id="n-stock" class="in" type="number" min="0" step="any" placeholder="0"></div>
  </div>
  <div class="mact"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-blue" onclick="addItem()">${ic('check',15)} Thêm vào kho</button></div>`)}
function addItem(){const name=$('#n-name').value.trim(),unit=$('#n-unit').value.trim();
 if(!name||!unit){toast('Cần nhập tên và đơn vị tính','err');return}
 const item={id:Math.max(...S.items.map(i=>i.id))+1,name,unit,group:$('#n-group').value,sup:+$('#n-sup').value,cost:+$('#n-cost').value||0,min:+$('#n-min').value||0,stock:0,exp:null};
 S.items.push(item);const st=+$('#n-stock').value||0;if(st>0){item.stock=st;log('in',item.id,st,'Tồn đầu kỳ',st*item.cost)}
 closeModal();S.sf='all';S.sg='all';S.q='';render();toast(`Đã thêm "${name}" vào kho`)}

/* ================= NHẬP KHO ================= */
function resetIn(itemId){S.inDraft={sup:itemId?it(itemId).sup:3,pay:'debt',lines:[itemId?{id:itemId,qty:'',price:it(itemId).cost}:{id:null,qty:'',price:''}]}}
function itemOptions(sel){return '<option value="">Chọn nguyên liệu…</option>'+Object.entries(GROUPS).map(([g,n])=>`<optgroup label="${n}">`+S.items.filter(i=>i.group===g).map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.name)} (${i.unit})</option>`).join('')+'</optgroup>').join('')}
const PAY={cash:'Tiền mặt',transfer:'Chuyển khoản',debt:'Ghi công nợ'};
function viewIn(){
 if(!S.inDraft)resetIn();const d=S.inDraft;
 return `<div class="split"><div class="card">
  <div class="cardhead"><div><h3>${ic('down',17)} Phiếu nhập kho mới</h3><p class="sub">Giá vốn từng nguyên liệu được tự tính lại theo bình quân gia quyền</p></div></div>
  <div class="fgrid"><div><label class="l" for="in-sup">Nhà cung cấp</label><select id="in-sup" class="in" onchange="S.inDraft.sup=+this.value">${S.suppliers.map(s=>`<option value="${s.id}" ${s.id===d.sup?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
   <div><label class="l">Thanh toán</label><div class="radios">${Object.entries(PAY).map(([k,v])=>`<label><input type="radio" name="pay" value="${k}" ${d.pay===k?'checked':''} onchange="S.inDraft.pay='${k}'">${v}</label>`).join('')}</div></div></div>
  <label class="l">Hàng nhập</label>
  ${d.lines.map((l,i)=>`<div class="lrow">
    <select class="in" aria-label="Nguyên liệu" onchange="lineItem(${i},this.value)">${itemOptions(l.id)}</select>
    <div class="qty"><input class="in" type="number" min="0" step="any" placeholder="Số lượng" aria-label="Số lượng" value="${l.qty}" oninput="S.inDraft.lines[${i}].qty=this.value;inTotals()"><span>${l.id?it(l.id).unit:''}</span></div>
    <input class="in" type="number" min="0" step="any" placeholder="Đơn giá" aria-label="Đơn giá" value="${l.price}" oninput="S.inDraft.lines[${i}].price=this.value;inTotals()">
    <div class="lsum" id="lt${i}">0đ</div>
    <button class="xbtn" onclick="delLine(${i})" aria-label="Xóa dòng">${ic('x',15)}</button>
    <div class="hint" id="lh${i}" hidden></div></div>`).join('')}
  <button class="btn btn-ghost btn-sm" onclick="addLine()">${ic('plus',14)} Thêm dòng</button>
  <div class="totalbar"><div><span class="muted">Tổng tiền phiếu nhập</span><div class="big" id="in-total">0đ</div></div><button class="btn btn-blue" onclick="saveIn()">${ic('check',16)} Lưu phiếu nhập</button></div>
 </div>
 <div class="card"><div class="cardhead"><div><h3>Phiếu nhập gần đây</h3></div></div>
  ${S.invoices.slice(0,8).map(v=>`<div class="arow"><span class="ico t-green">${ic('down',16)}</span><div class="tx"><b>${v.code} · ${money(v.total)}</b><span>${esc(supp(v.sup).contact)} · ${v.lines.length} mặt hàng · ${fmtTime(v.t)}</span></div><span class="chip ${v.pay==='debt'?'low':'gray'}">${PAY[v.pay]}</span></div>`).join('')}
 </div></div>`}
function lineItem(i,v){const l=S.inDraft.lines[i];l.id=v?+v:null;if(l.id)l.price=it(l.id).cost;else l.price='';render()}
function addLine(){S.inDraft.lines.push({id:null,qty:'',price:''});render()}
function delLine(i){S.inDraft.lines.splice(i,1);if(!S.inDraft.lines.length)S.inDraft.lines.push({id:null,qty:'',price:''});render()}
function inTotals(){let t=0;S.inDraft.lines.forEach((l,i)=>{const s=(+l.qty||0)*(+l.price||0);t+=s;const e=$('#lt'+i);if(e)e.textContent=money(s);
  const h=$('#lh'+i);if(h){const item=l.id&&it(l.id);if(item&&+l.price>item.cost*1.1){h.hidden=false;h.textContent=`⚠ Giá nhập cao hơn giá vốn hiện tại (${money(item.cost)}) ${Math.round((l.price/item.cost-1)*100)}%`}else h.hidden=true}});
 const e=$('#in-total');if(e)e.textContent=money(t)}
function saveIn(){const d=S.inDraft,lines=d.lines.filter(l=>l.id&&+l.qty>0);
 if(!lines.length){toast('Chưa có dòng hàng hợp lệ — hãy chọn nguyên liệu và nhập số lượng','err');return}
 const inv={code:nextCode(),sup:d.sup,t:Date.now(),pay:d.pay,lines:[],total:0};
 lines.forEach(l=>{const item=it(l.id),q=+l.qty,p=+l.price||item.cost;addStock(item,q,p);delete S.sugg[item.id];log('in',item.id,q,`${inv.code} · ${supp(d.sup).name}`,q*p);inv.total+=q*p;inv.lines.push({id:item.id,qty:q,price:p})});
 S.invoices.unshift(inv);if(d.pay==='debt')supp(d.sup).debt+=inv.total;
 resetIn();render();toast(`Đã lưu ${inv.code}: +${lines.length} mặt hàng, ${money(inv.total)}${d.pay==='debt'?' (ghi nợ NCC)':''}`)}

/* ================= XUẤT / HỦY ================= */
function viewOut(){
 if(!S.outD)S.outD={reason:0,id:null,qty:'',note:''};const d=S.outD,item=d.id?it(d.id):null;
 const waste=WASTE_BASE+S.ledger.filter(l=>l.type==='waste').reduce((a,l)=>a+Math.abs(l.value),0),use=USE_BASE+S.ledger.filter(l=>l.type==='use').reduce((a,l)=>a+Math.abs(l.value),0);
 const rec=S.ledger.filter(l=>l.type==='waste'||l.type==='use').slice(0,8);
 return `<div class="split"><div class="card">
  <div class="cardhead"><div><h3>${ic('up',17)} Xuất kho / Hủy hàng</h3><p class="sub">Ghi lại hàng hỏng, đổ vỡ, nhân viên ăn… để kho luôn khớp và biết hao hụt ở đâu</p></div></div>
  <div class="fgrid">
   <div><label class="l" for="o-r">Lý do</label><select id="o-r" class="in" onchange="S.outD.reason=+this.value">${REASONS.map((r,i)=>`<option value="${i}" ${d.reason===i?'selected':''}>${r[1]}</option>`).join('')}</select></div>
   <div><label class="l" for="o-i">Nguyên liệu</label><select id="o-i" class="in" onchange="S.outD.id=this.value?+this.value:null;render()">${itemOptions(d.id)}</select></div>
   <div><label class="l" for="o-q">Số lượng ${item?'('+item.unit+')':''}</label><input id="o-q" class="in" type="number" min="0" step="any" placeholder="0" value="${d.qty}" oninput="S.outD.qty=this.value">${item?`<small class="muted">Tồn hiện tại: ${num(item.stock)} ${item.unit}</small>`:''}</div>
  </div>
  <div style="margin-bottom:14px"><label class="l" for="o-n">Ghi chú</label><input id="o-n" class="in" placeholder="VD: lô rau nhập sáng bị dập" value="${esc(d.note)}" oninput="S.outD.note=this.value"></div>
  <div style="text-align:right"><button class="btn btn-orange" onclick="saveOut()">${ic('check',16)} Xác nhận xuất / hủy</button></div>
 </div>
 <div>
  <div class="tiles"><div class="tile t-red"><b>${money(waste)}</b><span>Hủy / hao hụt tháng này</span></div><div class="tile t-amber"><b>${money(use)}</b><span>Xuất dùng nội bộ</span></div></div>
  <div class="card"><div class="cardhead"><h3>Gần đây</h3></div>
   ${rec.map(l=>{const i=it(l.itemId);return `<div class="arow"><span class="ico ${l.type==='waste'?'t-red':'t-amber'}">${ic(l.type==='waste'?'trash':'up',16)}</span><div class="tx"><b>${esc(i.name)} · −${num(Math.abs(l.qty))} ${i.unit}</b><span>${esc(l.note)} · ${fmtTime(l.t)}</span></div><b class="neg">${money(Math.abs(l.value))}</b></div>`}).join('')}
  </div></div></div>`}
function saveOut(){const d=S.outD;if(!d.id){toast('Hãy chọn nguyên liệu','err');return}const item=it(d.id),q=+d.qty;
 if(!(q>0)){toast('Số lượng phải lớn hơn 0','err');return}
 if(q>item.stock+1e-9){toast(`Không đủ tồn: ${item.name} chỉ còn ${num(item.stock)} ${item.unit}`,'err');return}
 const [type,label]=REASONS[d.reason];item.stock=Math.round((item.stock-q)*1000)/1000;
 log(type,item.id,-q,label+(d.note.trim()?' – '+d.note.trim():''));S.outD=null;render();
 toast(`Đã ${type==='waste'?'hủy':'xuất'} ${num(q)} ${item.unit} ${item.name}`)}

/* ================= KIỂM KÊ ================= */
function viewCount(){
 const rows=S.items.filter(i=>S.cg==='all'||i.group===S.cg);
 return `<div class="card">
  <div class="cardhead"><div><h3>${ic('cliptick',17)} Kiểm kê kho</h3><p class="sub">Đếm thực tế rồi nhập vào ô “Thực tế”. Chỉ dòng có nhập mới được cân lại; chênh lệch được ghi vào sổ kho.</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <select class="in" style="width:auto" aria-label="Lọc nhóm" onchange="S.cg=this.value;render()"><option value="all">Tất cả nhóm</option>${Object.entries(GROUPS).map(([g,n])=>`<option value="${g}" ${S.cg===g?'selected':''}>${n}</option>`).join('')}</select>
    <button class="btn btn-ghost" onclick="cntSample()">Điền số mẫu</button><button class="btn btn-ghost" onclick="S.count={};render()">Xóa nhập</button>
    <button class="btn btn-orange" onclick="cntSave()">${ic('check',16)} Chốt kiểm kê</button></div></div>
  <div class="tw"><table><thead><tr><th>Nguyên liệu</th><th class="r">Sổ sách</th><th style="width:160px">Thực tế</th><th class="r">Chênh lệch</th><th class="r">Giá trị lệch</th></tr></thead><tbody>
  ${rows.map(i=>`<tr><td><b>${esc(i.name)}</b><small>${GROUPS[i.group]}</small></td><td class="r">${num(i.stock)} ${i.unit}</td>
   <td><input class="in" type="number" min="0" step="any" aria-label="Số lượng thực tế ${esc(i.name)}" placeholder="Nhập số đếm" value="${S.count[i.id]??''}" oninput="S.count[${i.id}]=this.value;cntCalc(${i.id});cntSum()"></td>
   <td class="r" id="cd${i.id}">—</td><td class="r" id="cv${i.id}"></td></tr>`).join('')}
  </tbody></table></div>
  <div class="sumbar" id="count-sum"></div></div>`}
function cntCalc(id){const v=S.count[id],i=it(id),dE=$('#cd'+id),vE=$('#cv'+id);if(!dE)return;
 if(v===''||v==null||isNaN(+v)){dE.textContent='—';dE.className='r';vE.textContent='';return}
 const d=Math.round((+v-i.stock)*100)/100;dE.textContent=(d>0?'+':d<0?'−':'')+num(Math.abs(d))+' '+i.unit;dE.className='r '+(d===0?'ok-t':d<0?'neg':'pos');
 vE.className='r '+(d<0?'neg':'pos');vE.textContent=d===0?'':(d>0?'+':'−')+money(Math.abs(d*i.cost))}
function cntSum(){let n=0,diff=0,val=0;for(const id in S.count){const v=S.count[id];if(v===''||isNaN(+v))continue;const i=it(+id),d=+v-i.stock;n++;if(Math.abs(d)>1e-9){diff++;val+=d*i.cost}}
 const e=$('#count-sum');if(e)e.innerHTML=`<span>Đã đếm: ${n} mặt hàng</span><span>Lệch: ${diff} mặt hàng</span><span class="${val<0?'neg':val>0?'pos':''}">Tổng giá trị lệch: ${val>0?'+':val<0?'−':''}${money(Math.abs(val))}</span>`}
function cntAll(){Object.keys(S.count).forEach(id=>cntCalc(+id));cntSum()}
function cntSample(){S.cg='all';S.count={};const dl={20:-4,3:-.4,7:-.5,12:-3,19:0,9:.4};Object.entries(dl).forEach(([id,d])=>S.count[id]=String(Math.round((it(+id).stock+d)*100)/100));render()}
function cntSave(){let n=0,val=0;
 for(const id in S.count){const v=S.count[id];if(v===''||isNaN(+v))continue;const i=it(+id),d=Math.round((+v-i.stock)*1000)/1000;if(d===0)continue;
  i.stock=Math.round(+v*1000)/1000;log('count',i.id,d,`Kiểm kê: ${d<0?'thiếu':'thừa'} ${num(Math.abs(d))} ${i.unit} so với sổ sách`);n++;val+=d*i.cost}
 const filled=Object.values(S.count).filter(v=>v!==''&&!isNaN(+v)).length;
 if(!filled){toast('Chưa nhập số đếm thực tế nào','err');return}
 S.count={};render();toast(n?`Đã cân kho ${n} mặt hàng · tổng lệch ${val<0?'−':'+'}${money(Math.abs(val))}`:'Kiểm kê xong — số liệu khớp sổ sách 100%')}

/* ================= CÔNG THỨC ================= */
function viewRecipe(){
 const r0=S.recipes.find(r=>r.id===S.simDish);
 return `<div class="card" style="margin-bottom:14px">
  <div class="cardhead"><div><h3>${ic('play',16)} Thử nghiệm: khách gọi món → kho tự trừ</h3><p class="sub">Trong hệ thống thật, kho tự trừ khi bếp xác nhận món / thu ngân chốt bill</p></div></div>
  <div class="sim">
   <div style="flex:1;min-width:240px"><label class="l" for="sd">Món</label><select id="sd" class="in" onchange="S.simDish=+this.value">${S.recipes.map(r=>`<option value="${r.id}" ${r.id===S.simDish?'selected':''}>${esc(r.name)} — ${money(r.price)}</option>`).join('')}</select></div>
   <div><label class="l">Số phần</label><div class="stepper"><button onclick="simQ(-1)" aria-label="Giảm">−</button><input id="sq" type="number" min="1" value="${S.simQty}" onchange="S.simQty=Math.max(1,Math.floor(+this.value)||1);render()"><button onclick="simQ(1)" aria-label="Tăng">+</button></div></div>
   <button class="btn btn-blue" onclick="sellDish()">${ic('cart',16)} Bán & trừ kho</button>
  </div>
  <div class="simnote">Thử bán nhiều phần <b>Cá chép rán giòn</b> để thấy cảnh báo thiếu nguyên liệu, hoặc bán vài phần <b>Rau muống xào tỏi</b> để thấy kho tụt xuống dưới định mức.</div>
 </div>
 <div class="card" style="padding:6px 8px"><div class="tw"><table><thead><tr><th>Món</th><th>Định lượng / phần</th><th class="r">Giá vốn</th><th class="r">Giá bán</th><th class="r">Food cost</th><th class="r">Lãi gộp</th><th>Còn làm được</th></tr></thead><tbody>
 ${S.recipes.map(r=>{const c=dishCost(r),p=c/r.price*100,cap=dishCap(r);
  return `<tr><td style="min-width:180px"><b>${esc(r.name)}</b></td>
  <td><div class="recipe-ing">${r.ing.map(([id,q])=>`<span>${esc(it(id).name)} ${num(q)} ${it(id).unit}</span>`).join('')}</div></td>
  <td class="r">${money(c)}</td><td class="r"><b>${money(r.price)}</b></td>
  <td class="r"><span class="chip ${fcCls(p)}">${num(p)}%</span></td><td class="r pos">${money(r.price-c)}</td>
  <td><span class="chip ${cap.n<=5?'out':cap.n<=15?'low':'ok'}">~${cap.n} phần</span><small>Giới hạn: ${esc(cap.lim.name)}</small></td></tr>`}).join('')}
 </tbody></table></div>
 <p class="muted" style="padding:6px 12px 12px;font-size:12.5px">Food cost: <span class="chip ok">≤ 35% tốt</span> <span class="chip low">35–45% cần chú ý</span> <span class="chip out">&gt; 45% nên xem lại giá bán hoặc định lượng</span> — giá vốn tự cập nhật theo giá nhập mới nhất.</p></div>`}
function simQ(d){S.simQty=Math.max(1,S.simQty+d);render()}
function sellDish(){const r=S.recipes.find(x=>x.id===S.simDish),q=S.simQty,short=[];
 r.ing.forEach(([id,n])=>{const i=it(id);if(i.stock+1e-9<n*q)short.push(`${i.name} (cần ${num(n*q)} ${i.unit}, còn ${num(i.stock)})`)});
 if(short.length){toast('Không đủ nguyên liệu: '+short.join('; '),'err');return}
 const warn=[];r.ing.forEach(([id,n])=>{const i=it(id),b=status(i);i.stock=Math.round((i.stock-n*q)*1000)/1000;log('sale',id,-n*q,`Bán ${q} × ${r.name}`);const a=status(i);if(b==='ok'&&a!=='ok')warn.push(i.name)});
 render();toast(`Đã bán ${q} × ${r.name} — kho tự trừ ${r.ing.length} nguyên liệu`+(warn.length?` ⚠ ${warn.join(', ')} xuống dưới định mức`:''))}

/* ================= ĐẶT HÀNG ================= */
function viewOrder(){
 const list=needList();
 if(!list.length)return '<div class="card"><div class="empty">Không có mặt hàng nào cần đặt thêm 🎉</div></div>';
 const bySup={};list.forEach(i=>(bySup[i.sup]=bySup[i.sup]||[]).push(i));
 const grand=list.reduce((a,i)=>a+qtyOf(i)*i.cost,0);
 return `<div class="card" style="margin-bottom:14px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap">
   <div><h3>${ic('cart',17)} Đề xuất đặt hàng tự động</h3><p class="sub">${list.length} mặt hàng dưới định mức · số lượng gợi ý = đủ lên gấp đôi mức tối thiểu (sửa được)</p></div>
   <div style="text-align:right"><span class="muted">Dự kiến tổng</span><div style="font-size:22px;font-weight:800" id="grand">${money(grand)}</div></div></div>
  <div class="sup">${Object.entries(bySup).map(([sid,arr])=>{const s=supp(+sid);
   return `<div class="card"><div class="cardhead" style="margin-bottom:8px"><div><h4>${esc(s.name)}</h4><p class="sub">${esc(s.kind)} · ${s.phone}</p></div></div>
   ${arr.map(i=>`<div class="arow" style="gap:8px"><div class="tx"><b>${esc(i.name)}</b><span>Tồn ${num(i.stock)}/${num(i.min)} ${i.unit} · ${money(i.cost)}</span></div>
     <input class="in" style="width:84px" type="number" min="0" step="any" aria-label="Số lượng đặt ${esc(i.name)}" value="${qtyOf(i)}" oninput="S.sugg[${i.id}]=+this.value;sgTot(${s.id})"><span class="muted" style="width:34px;font-size:12px">${i.unit}</span></div>`).join('')}
   <div class="totalbar" style="margin-top:8px"><div><span class="muted">Tạm tính</span><div style="font-weight:800;font-size:17px" id="sg${s.id}">${money(arr.reduce((a,i)=>a+qtyOf(i)*i.cost,0))}</div></div></div>
   <div class="mact" style="justify-content:flex-start"><button class="btn btn-ghost btn-sm" onclick="copyMsg(${s.id})">${ic('copy',14)} Sao chép tin nhắn</button><button class="btn btn-blue btn-sm" onclick="draftFromSugg(${s.id})">${ic('down',14)} Tạo phiếu nhập</button></div></div>`}).join('')}</div>`}
function sgTot(sid){const arr=needList().filter(i=>i.sup===sid);const e=$('#sg'+sid);if(e)e.textContent=money(arr.reduce((a,i)=>a+qtyOf(i)*i.cost,0));
 const g=$('#grand');if(g)g.textContent=money(needList().reduce((a,i)=>a+qtyOf(i)*i.cost,0))}
function zaloMsg(sid){const s=supp(sid),d=new Date();
 return `Chào ${s.contact}, nhà hàng Ăn Ngon Hoà Lạc cần đặt hàng ngày ${pad(d.getDate())}/${pad(d.getMonth()+1)}:\n`+needList().filter(i=>i.sup===sid).map(i=>`- ${i.name}: ${num(qtyOf(i))} ${i.unit}`).join('\n')+`\nNhờ ${s.contact} giao giúp trước 15h. Cảm ơn!`}
function copyMsg(sid){const t=zaloMsg(sid);
 const done=()=>toast('Đã sao chép tin nhắn — dán vào Zalo gửi NCC');
 const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
function draftFromSugg(sid){S.inDraft={sup:sid,pay:'debt',lines:needList().filter(i=>i.sup===sid).map(i=>({id:i.id,qty:qtyOf(i),price:i.cost}))};go('in')}

/* ================= NHÀ CUNG CẤP ================= */
function viewSup(){
 return `<div class="sup">${S.suppliers.map(s=>{const inv=S.invoices.filter(v=>v.sup===s.id),last=inv[0],n=S.items.filter(i=>i.sup===s.id).length,tot=inv.reduce((a,v)=>a+v.total,0);
  return `<div class="card"><div class="cardhead" style="margin-bottom:8px"><div><h4>${esc(s.name)}</h4><p class="sub">${esc(s.kind)}</p></div><span class="chip ${s.debt>0?'low':'ok'}">${s.debt>0?'Đang nợ':'Hết nợ'}</span></div>
  <div class="kv"><span class="muted">Liên hệ</span><b>${s.phone}</b></div>
  <div class="kv"><span class="muted">Mặt hàng cung cấp</span><b>${n}</b></div>
  <div class="kv"><span class="muted">Nhập gần nhất</span><b>${last?fmtTime(last.t):'—'}</b></div>
  <div class="kv"><span class="muted">Đã nhập (7 ngày gần đây)</span><b>${money(tot)}</b></div>
  <div class="kv"><span class="muted">Công nợ phải trả</span><b class="${s.debt>0?'neg':''}">${money(s.debt)}</b></div>
  <div class="mact" style="justify-content:flex-start"><button class="btn btn-ghost btn-sm" onclick="goIn(${S.items.find(i=>i.sup===s.id)?.id||''})">${ic('down',14)} Nhập hàng</button><button class="btn btn-orange btn-sm" ${s.debt>0?'':'disabled'} onclick="openPay(${s.id})">${ic('wallet',14)} Thanh toán nợ</button></div></div>`}).join('')}</div>`}
function openPay(id){const s=supp(id);
 modal('Thanh toán công nợ',`<p style="margin-bottom:12px"><b>${esc(s.name)}</b><br><span class="muted">Đang nợ: ${money(s.debt)}</span></p>
  <div class="fgrid"><div><label class="l" for="p-a">Số tiền thanh toán (đ)</label><input id="p-a" class="in" type="number" min="0" step="any" value="${s.debt}"></div>
  <div><label class="l" for="p-m">Hình thức</label><select id="p-m" class="in"><option>Tiền mặt</option><option>Chuyển khoản</option></select></div></div>
  <div class="mact"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-orange" onclick="doPay(${id})">Xác nhận thanh toán</button></div>`)}
function doPay(id){const s=supp(id),a=+$('#p-a').value;
 if(!(a>0)||a>s.debt){toast('Số tiền phải lớn hơn 0 và không vượt quá công nợ','err');return}
 s.debt-=a;closeModal();render();toast(`Đã thanh toán ${money(a)} cho ${s.contact}${s.debt?` · còn nợ ${money(s.debt)}`:' · hết nợ'}`)}

/* ================= LỊCH SỬ ================= */
function viewLog(){
 const cnt=t=>t==='all'?S.ledger.length:S.ledger.filter(l=>l.type===t).length,rows=S.ledger.filter(l=>S.lf==='all'||l.type===S.lf).slice(0,120);
 return `<div class="filters">${[['all','Tất cả'],...Object.entries(TYPES).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="pill ${S.lf===k?'on':''}" onclick="S.lf='${k}';render()">${l} (${cnt(k)})</button>`).join('')}</div>
 <div class="card" style="padding:6px 8px"><div class="tw"><table><thead><tr><th>Thời gian</th><th>Loại</th><th>Nguyên liệu</th><th class="r">Số lượng</th><th class="r">Giá trị</th><th>Người thực hiện</th><th>Ghi chú</th></tr></thead><tbody>
 ${rows.map(l=>{const i=it(l.itemId),t=TYPES[l.type];return `<tr><td style="white-space:nowrap">${fmtTime(l.t)}</td><td><span class="chip ${t[1]}">${t[0]}</span></td><td><b>${esc(i.name)}</b></td>
  <td class="r ${l.qty<0?'neg':'pos'}">${l.qty>0?'+':'−'}${num(Math.abs(l.qty))} ${i.unit}</td><td class="r">${money(Math.abs(l.value))}</td><td>${l.user}</td><td class="muted">${esc(l.note)}</td></tr>`}).join('')}
 </tbody></table></div></div>`}

/* ================= START ================= */
buildTop();render();
</script>
