<html lang="vi">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="color-scheme" content="light">
<script>

window.addEventListener('load',function(){if(window.__ok)return;var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:999;background:#fff;color:#0f172a;padding:24px;font:16px/1.5 system-ui,sans-serif';
d.innerHTML='<b style="font-size:19px">Trình duyệt này chưa chạy được bản demo</b><p style="margin-top:8px">Hãy mở bằng Chrome hoặc Safari bản mới (không mở trong Zalo / Facebook), hoặc cập nhật trình duyệt.</p><p style="margin-top:12px;color:#b91c1c;font-size:13px">'+(window.__err.join('<br>')||'Không rõ lỗi')+'</p><p style="margin-top:8px;color:#64748b;font-size:13px">'+navigator.userAgent+'</p>';document.body.appendChild(d)});

<title>Ăn Ngon Hoà Lạc – Bản demo quản lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;
  --blue:#0a84ff;--blue-soft:#eaf4ff;--orange:#ff4d00;--orange-soft:#fff1e8;
  --green:#059669;--green-soft:#e6f7f0;--red:#e11d48;--red-soft:#fff0f3;--amber:#b45309;--amber-soft:#fff5dc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#e2e8f0;color-scheme:light}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:#e2e8f0;color:var(--ink);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
input,select{font:inherit;font-size:16px;color:inherit}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)}

.phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(15,23,42,.12)}

/* ===== thanh trên cùng giống app POS ===== */
.pos{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.pos .r1{display:flex;align-items:center;gap:7px;padding:6px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-size:19px;flex:none}
.pos .t{flex:1;min-width:0}
.pos .t b{display:block;font-size:14.5px;line-height:1.15}
.pos .t small{color:var(--green);font-size:11px;font-weight:500;display:flex;gap:4px;align-items:center;white-space:nowrap}
.notify{background:#ffb48a;color:#fff;border-radius:99px;padding:0 10px;min-height:32px;font-weight:800;font-size:12px;display:flex;gap:4px;align-items:center;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#eef2f7;display:grid;place-items:center;flex:none;color:var(--ink2)}
.pos .r1 .iconbtn{width:32px;height:32px;border-radius:10px}
.pos .nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:3px 6px 5px;gap:0;border-top:1px solid #f1f5f9}
.pos .nav::-webkit-scrollbar{display:none}
.pos .nav button{flex:none;padding:4px 9px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;line-height:1.25}
.pos .nav button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.rep .page{padding:12px 12px 40px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.rcard h2{font-size:21px;letter-spacing:-.3px}
.rcard h3{font-size:17px;font-weight:800}
.rsub{color:var(--muted);font-size:14.5px;margin-top:4px}
.rpills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rp{background:#eef2f7;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.rp.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.rdate{display:flex;align-items:center;gap:8px;background:#eef2f7;border-radius:99px;padding:10px 14px;margin-top:12px;font-size:14.5px;color:var(--ink2);flex-wrap:wrap}
.rkpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;min-height:108px;min-width:0}
.rk .l{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;color:var(--muted);font-size:14px}
.rk .v{font-size:clamp(19px,5.6vw,27px);font-weight:800;margin:6px 0 2px;letter-spacing:-.5px;white-space:nowrap}
.rk .s{color:var(--muted);font-size:13.5px}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rt{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 6px;font-weight:700;font-size:14px;text-align:center;position:relative;line-height:1.25;min-height:54px;display:flex;align-items:center;justify-content:center}
.rt.on{background:#111c33;color:#fff;border-color:#111c33}
.rt .nw{position:absolute;top:-7px;right:6px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px}
.rmuted{color:var(--muted);font-size:14.5px}
.mrow{padding:10px 0;border-bottom:1px solid #eef2f6}
.mrow:last-child{border-bottom:0}
.mrow .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.hrs{display:flex;gap:3px;align-items:flex-end;height:130px;margin-top:12px}
.hrs i{display:block;flex:1;background:#4f8df5;border-radius:4px;min-height:3px}
.hlab{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;font-size:11px;color:var(--muted);margin-top:6px}
.hlab span{text-align:center;white-space:nowrap}
.rank{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f6}
.rank:last-child{border-bottom:0}
.rank .no{width:28px;height:28px;border-radius:9px;background:#eef2f7;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rank .tx{flex:1;min-width:0}
.rank .tx b{display:block;font-size:15px}
.rank .tx span{font-size:13px;color:var(--muted)}
.dchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.dchip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:none}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
.rrow{padding:14px 0;border-bottom:1px solid #eef2f6}
.rrow:last-of-type{border-bottom:0}
.rrow b{font-size:16px}
.rrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rrow .inl{display:flex;gap:10px;align-items:center;margin-top:8px}
.rrow .inl .in{flex:1}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eef2f6}
.pl.tot{font-weight:800;font-size:17px}
.pl small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#eef2f7;margin:12px 0 8px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;gap:5px;align-items:center}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.fold-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.fold-h h3{font-size:17px}
.fsum{display:flex;align-items:center;gap:8px;flex:none}
.chv{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#eef2f7;color:var(--ink2);transition:transform .2s}
.chv.open{transform:rotate(180deg)}
.fold-b{margin-top:12px}
.srow .fold-h{padding:2px 0}
.srow{padding:12px 0;border-bottom:1px solid #eef2f6}
.srow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.srow .fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.sday{display:grid;grid-template-columns:1fr 78px 86px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f6}
.sday:last-child{border-bottom:0}
.sday .in{min-height:42px;text-align:center;padding:0 6px}
.phone.rep .tabbar:empty,.tabbar:empty{display:none}
.ktitle{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.ktitle:empty{display:none}
.ktitle b{font-size:21px;letter-spacing:-.3px;flex:1}
.ktitle .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}

.page{padding:14px 16px 120px}
.page>*+*{margin-top:14px}
.demo{font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid #f6d68a;border-radius:12px;padding:8px 12px;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3,.sec h3{font-size:16px;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hello h2{font-size:22px;letter-spacing:-.3px}
.hello p{color:var(--muted);font-size:13px;font-weight:600}

.btn{min-height:50px;border-radius:14px;padding:0 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(10,132,255,.25)}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 6px 14px rgba(255,77,0,.22)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{min-height:40px;font-size:14px;padding:0 14px;width:auto;border-radius:12px}
.btn[disabled]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{color:var(--blue);font-weight:700;font-size:14px;padding:6px 0}

.hero{background:linear-gradient(135deg,#0a84ff,#2563eb);color:#fff;border:0}
.hero .n{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.hero p{opacity:.9;font-size:14px;margin-top:2px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.hero .chips span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.hero .btn{background:#fff;color:var(--blue);box-shadow:none}
.hero.ok{background:linear-gradient(135deg,#10b981,#059669)}
.hero.ok .btn{color:var(--green)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:19px;font-weight:800;margin-top:2px}

.act{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:84px;width:100%}
.act .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.act b{font-size:14.5px}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-green{background:var(--green-soft);color:var(--green)}.t-orange{background:var(--orange-soft);color:var(--orange)}
.t-red{background:var(--red-soft);color:var(--red)}.t-amber{background:var(--amber-soft);color:var(--amber)}.t-gray{background:#f1f5f9;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}.chip.low{background:var(--amber-soft);color:var(--amber)}.chip.out{background:var(--red-soft);color:var(--red)}.chip.gray{background:#f1f5f9;color:var(--muted)}.chip.auto{background:var(--blue-soft);color:var(--blue);padding:2px 8px;font-size:12px}

.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #eef2f6;width:100%;text-align:left;min-height:60px}
.row:last-child{border-bottom:0}
button.row:active{background:#f8fafc}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px}
.row .tx span{color:var(--muted);font-size:13.5px}
.row .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14.5px;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--muted);flex:1;min-height:48px}
.search input{border:0;outline:0;width:100%;background:transparent;color:var(--ink)}
.sbar{display:flex;gap:10px}
.addbtn{width:48px;height:48px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}

.seg{display:flex;gap:8px}
.sg{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 6px;font-weight:700;color:var(--muted);font-size:15px}
.sg.s{padding:9px 4px;font-size:13.5px}
.sg.ok.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.sg.low.on{background:var(--amber-soft);border-color:#f59e0b;color:var(--amber)}
.sg.out.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.sg.on.plain{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}

label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.in{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
.frow{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.radios{display:flex;gap:8px}
.radios label{flex:1;margin:0;border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.radios input{display:none}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}

/* công tắc */
.sw{position:relative;display:inline-block;width:54px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:before{transform:translateX(22px)}
.sw input:focus-visible+i{outline:3px solid rgba(10,132,255,.4)}
.swrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.swrow b{font-size:15px}
.swrow span{display:block;font-size:13px;color:var(--muted);font-weight:400}

.group{margin-bottom:14px}
.group h4{font-size:14px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:center}
.group h4 small{font-weight:500;color:var(--muted)}
.qin{display:flex;align-items:center;gap:6px}
.qin input{width:68px;min-height:42px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-weight:700;outline:none}
.qin span{font-size:13.5px;color:var(--muted);min-width:34px}
.stepper{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:50px}
.stepper button{width:46px;background:#f8fafc;font-weight:800;font-size:20px}
.stepper input{width:56px;border:0;text-align:center;outline:0;font-weight:700}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 12px}
.daytitle{font-size:13px;font-weight:800;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.unitchips{display:flex;gap:8px;flex-wrap:wrap}
.unitchips .u{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 8px 8px 16px;font-weight:700}
.unitchips .u button{width:26px;height:26px;border-radius:99px;background:#f1f5f9;display:grid;place-items:center;color:var(--muted)}
.neg{color:var(--red);font-weight:700}
.gtitle{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 4px 8px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px;position:relative}
.tabbar button.on{color:var(--blue)}
.tabbar .b{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#cbd5e1;margin:4px auto 12px}
.sheet h3{font-size:19px;margin-bottom:2px}
.sheet .sub{color:var(--muted);font-size:14px}
.sheet .acts{margin-top:18px;display:grid;gap:10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;width:calc(100% - 32px);max-width:440px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 12px 30px rgba(15,23,42,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#34d399}.toast.err svg{color:#fda4af}
.view{animation:fade .2s}
/* ===== bán hàng ===== */
.iconbtn{position:relative}
.dotr{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.ubtn{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:2px 2px 2px 4px;flex:none;max-width:104px;text-align:right}
.ubtn b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

 const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}

 return `<div class="card"><h3>Hôm nay mua gì?</h3><p class="muted" style="font-size:14px">Ghi như ngoài chợ: “10 ký thịt”, “20 bó rau”. Không cần cân chính xác.</p>

  ${today.length?`<div class="list">${today.map(buyRow).join('')}</div>`:'<div class="card empty">Chưa ghi món nào hôm nay</div>'}</div>`}
function buyRow(b){return `<div class="row"><div class="tx"><b>${esc(b.name)} · ${num(b.qty)} ${esc(b.unit)}</b><span>${esc(sp(b.sup).short)}${b.paid?'':' · <span class="neg">ghi nợ</span>'}</span></div><b>${b.money?money(b.money):'<span class="muted" style="font-weight:500">chưa ghi tiền</span>'}</b></div>`}
function buyName(v){S.buyD.name=v;const m=buyItem();if(m){S.buyD.unit=uUnit(m);S.buyD.sup=m.sup;$('#b-unit').value=S.buyD.unit;$('#b-sup').value=m.sup;if(!S.buyD.qty&&m.usual){S.buyD.qty=m.usual;$('#b-qty').value=m.usual}}hintUpd()}
function saveBuy(){const d=S.buyD,name=d.name.trim(),q=+d.qty;
 if(!name){toast('Gõ tên món đã mua','err');return}
 if(!(q>0)){toast('Ghi số lượng (ước chừng cũng được)','err');return}
 let i=buyItem();
 if(!i){i={id:Math.max(0,...S.items.map(x=>x.id))+1,name,g:'other',unit:d.unit,lv:'ok',amt:q,sup:+d.sup,usual:q};S.items.push(i)}
 else if(i.auto){i.amt=(i.amt||0)+q*buyFactor(i);refresh(i)}
 else{i.lv='ok';i.amt=q;i.unit=d.unit;if(!i.usual)i.usual=q}
 const m=+d.money||0;S.buys.unshift({id:++S.lid,t:Date.now(),name:i.name,qty:q,unit:d.unit,money:m,sup:+d.sup,paid:d.paid});
 if(!d.paid&&m&&S.sups.some(s=>s.id===+d.sup))sp(+d.sup).debt+=m;resetBuy();render();toast(`Đã ghi: ${i.name} ${num(q)} ${d.unit}${m?' · '+money(m):''}`)}

 if(on){if(i.amt==null)i.amt=0;if(i.min==null)i.min=5;refresh(i);toast(i.amt?`Đã bật tự trừ cho ${i.name}`:`Đã bật tự trừ cho ${i.name} — vào Kho nhập số đang có`)}

function vSup(){return S.sups.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><h3>${esc(s.name)}</h3><p class="muted" style="font-size:14px">${esc(s.kind)} · ${esc(s.phone)}</p></div><button class="btn btn-ghost btn-sm" onclick="openSup(${s.id})">${ic('edit',15)} Sửa</button></div>

function openSup(id){const s=id?sp(id):{name:'',short:'',phone:'',kind:'',debt:0};
 sheet(`<h3>${id?'Sửa nhà cung cấp':'Thêm nhà cung cấp'}</h3>
 <label class="l" for="s-n">Tên</label><input id="s-n" class="in" placeholder="VD: Chú Ba – bán cá" value="${esc(s.name)}">
 <label class="l" for="s-s">Gọi tắt (dùng trong tin nhắn đặt hàng)</label><input id="s-s" class="in" placeholder="VD: chú Ba" value="${esc(s.short)}">
 <label class="l" for="s-p">Số điện thoại</label><input id="s-p" class="in" type="tel" inputmode="tel" placeholder="09…" value="${esc(s.phone)}">
 <label class="l" for="s-k">Bán gì</label><input id="s-k" class="in" placeholder="VD: Cá, tôm" value="${esc(s.kind)}">
 <div class="acts"><button class="btn btn-blue" onclick="saveSup(${id||'null'})">${ic('check',18)} ${id?'Lưu':'Thêm'}</button>${id?`<button class="btn btn-danger" onclick="delSup(${id})">Xóa nhà cung cấp</button>`:''}<button class="btn btn-ghost" onclick="closeSheet()">Hủy</button></div>`)}
function saveSup(id){const n=$('#s-n').value.trim();if(!n){toast('Nhập tên nhà cung cấp','err');return}
 const v={name:n,short:$('#s-s').value.trim()||n.split('–')[0].trim(),phone:$('#s-p').value.trim()||'—',kind:$('#s-k').value.trim()||'—'};
 if(id)Object.assign(sp(id),v);else S.sups.push({id:Math.max(0,...S.sups.map(s=>s.id))+1,debt:0,...v});
 closeSheet();render();toast(id?'Đã lưu thay đổi':'Đã thêm nhà cung cấp')}
function delSup(id){const s=sp(id),used=S.items.filter(i=>i.sup===id).length;
 if(used){toast(`Còn ${used} món đang mua của nhà này — đổi sang nhà khác trước khi xóa`,'err');return}
 if(s.debt>0){toast(`Còn nợ ${money(s.debt)} — trả nợ xong mới xóa được`,'err');return}
 if(S.cd!=='s'+id){S.cd='s'+id;toast('Bấm “Xóa nhà cung cấp” thêm lần nữa để xác nhận','err');return}
 S.sups=S.sups.filter(x=>x.id!==id);closeSheet();render();toast('Đã xóa nhà cung cấp')}
function openPay(id){const s=sp(id);sheet(`<h3>Trả nợ ${esc(s.short)}</h3><p class="sub">Đang nợ ${money(s.debt)}</p><label class="l" for="p-a">Số tiền trả</label><input id="p-a" class="in mny" type="text" inputmode="numeric" autocomplete="off" value="${fmtIn(s.debt)}">

 <button class="btn btn-blue" onclick="setTab('home');toast('Kiểm xong — còn '+needList().length+' món cần mua')">${ic('check',18)} Xong kiểm kho</button>`}

const isOpen=(k,def)=>S.fold[k]===undefined?def:S.fold[k];

function fold(k,def,title,sum,body,sub){const o=isOpen(k,def);

function vOver(inv,net){

 const top=Object.entries(agg).sort((a,b)=>b[1].m-a[1].m).slice(0,6),tm=top[0]?top[0][1].m:1;

 const tp=top.length?top.map(([nm,a],k)=>`<div class="rank"><span class="no">${k+1}</span><div class="tx"><b>${esc(nm)}</b><span>${a.q} phần · ${money(a.m)}</span><div class="bar" style="margin-top:6px"><i style="width:${a.m/tm*100}%"></i></div></div></div>`).join(''):'<p class="rmuted">Chưa có dữ liệu món bán ra.</p>';
 const chs={};inv.forEach(i=>{const k=i.ch||'take';(chs[k]=chs[k]||{n:0,m:0});chs[k].n++;chs[k].m+=i.amount});

function recCalc(d){const st=dayStat(d),r=recOf(d),out=hasV(r.out)?+r.out:0,exp={cash:st.cash-out,bank:st.bank,wallet:st.wallet},res={};let diff=0,complete=true,act=0,need=0;
 for(const m of ['cash','bank','wallet']){const v=r.act[m],h=hasV(v);if(!h&&exp[m]>0)complete=false;res[m]={exp:exp[m],act:h?+v:null,diff:h?+v-exp[m]:null};need+=exp[m];if(h){diff+=+v-exp[m];act+=+v}}
 return{st,r,out,res,diff,complete,act,need}}
function dChip(df){if(df==null)return '<span class="chip gray">Chưa nhập</span>';if(Math.abs(df)<1)return '<span class="chip ok">Khớp</span>';return df<0?`<span class="chip out">Thiếu ${money(-df)}</span>`:`<span class="chip low">Thừa ${money(df)}</span>`}

 <label class="l" for="op-c">Tiền lẻ đang có trong két (đếm thực tế)</label><input id="op-c" class="in mny" type="text" inputmode="numeric" autocomplete="off" value="${fmtIn(prev?prev.leave:500000)}">
 <p class="sub" style="margin-top:8px">Mở ca cũng tự chấm công <b>vào ca</b> cho bạn. Chốt ca sẽ tự <b>ra ca</b>.</p>
 <div class="acts"><button class="btn btn-blue" onclick="doOpenShift()">${ic('check',18)} Mở ca</button><button class="btn btn-ghost" onclick="closeSheet()">Hủy</button></div>`)}
const lastClosed=()=>[...S.shifts].filter(x=>x.status==='closed').sort((a,b)=>b.end-a.end)[0];
function doOpenShift(){const v=unm($('#op-c').value);if(v===''){toast('Nhập số tiền lẻ trong két','err');return}const prev=lastClosed(),open=+v;
 const sh={id:Math.max(0,...S.shifts.map(x=>x.id))+1,by:S.me,name:me().name,start:Date.now(),open,outs:[],status:'open'};
 if(prev&&open!==prev.leave){sh.openDiff=open-prev.leave}
 S.shifts.push(sh);S.shift=sh.id;INV.forEach(i=>{if(!i.shift&&i.day===0)i.shift=sh.id});let ck='';if(!S.clk[S.me]&&can('clock')){S.clk[S.me]=Date.now();ck=' · đã chấm công vào ca'}
 logA(`Mở ca thu ngân, tiền đầu ca ${money(open)}${sh.openDiff?` (lệch ${money(sh.openDiff)} so với ca trước)`:''}`);
 closeSheet();render();toast(`Đã mở ca, tiền đầu ca ${money(open)}${ck}`)}
function scCalc(){const sh=curShift(),e=shiftExp(sh),c=S.sc,ex={cash:e.cash,bank:e.bank,wallet:e.wallet},r={};let diff=0,ok=true;
 for(const m of ['cash','bank','wallet']){if(m!=='cash'&&ex[m]<=0)continue;const h=hasV(c[m]);if(!h)ok=false;r[m]=h?+c[m]-ex[m]:null;if(h)diff+=r[m]}
 return{e,ex,r,diff,ok}}
function renderClose(){const sh=curShift(),k=scCalc(),e=k.e,c=S.sc,hold=codHold();
 const inp=(m,l,sub)=>`<label class="l" for="sc-${m}">${l}</label><small class="muted" style="display:block;margin:-2px 0 6px;font-size:12.5px">${sub}</small><div class="inl" style="display:flex;gap:10px;align-items:center"><input id="sc-${m}" class="in mny" type="text" inputmode="numeric" autocomplete="off" placeholder="Số thực nhận" value="${fmtIn(c[m])}" oninput="S.sc.${m}=unm(this.value);scUpd()"><span id="sd-${m}">${dChip(k.r[m])}</span></div>`;
 sheet(`<h3>Chốt ca · ${esc(sh.name)}</h3><p class="sub">${hm(sh.start)} → ${hm(Date.now())} · ${e.n.all} hóa đơn · doanh thu <b>${money(e.revenue)}</b></p>
 <div class="card" style="margin-top:12px;padding:4px 14px">
  <div class="pl"><span>Tiền đầu ca</span><b>${money(sh.open)}</b></div>
  <div class="pl"><span>+ Bán tiền mặt${e.n.cod?`<small>gồm ${e.n.cod} đơn COD shipper đã nộp</small>`:''}</span><b>${money(e.sales.cash)}</b></div>
  <div class="pl"><span>− Đã chi từ két</span><b>${money(e.out)}</b></div>
  ${sh.outs.map(o=>`<div class="pl" style="padding:3px 0 3px 12px;font-size:13px;border:0"><span class="muted">${esc(o.txt)} · ${hm(o.t)}</span><span>${money(o.amt)}</span></div>`).join('')}
  <div class="pl tot" style="border:0"><span>= Tiền mặt cần có</span><span>${money(e.cash)}</span></div></div>
 <div class="sbar" style="margin-top:10px"><input id="co-t" class="in" placeholder="Chi từ két: VD mua đá"><input id="co-a" class="in mny" style="width:104px;flex:none" type="text" inputmode="numeric" placeholder="Số tiền"><button class="btn btn-ghost btn-sm" style="flex:none" onclick="addOut()">+ Chi</button></div>
 ${inp('cash','Đếm tiền mặt thực tế trong két','Đếm hết tiền trong két, kể cả tiền lẻ đầu ca')}
 ${e.bank>0?inp('bank','Chuyển khoản trong ca','Phần mềm ghi '+money(e.bank)+' · xem sao kê rồi nhập số thực nhận'):''}
 ${e.wallet>0?inp('wallet','Ví điện tử trong ca','Phần mềm ghi '+money(e.wallet)+' · xem lịch sử ví'):''}
 <div style="background:#f8fafc;border-radius:14px;padding:10px 14px;margin-top:12px"><div class="pl" style="border:0;padding:4px 0"><span>Chênh lệch cả ca</span><span id="sc-diff">${k.ok?dChip(k.diff):'<span class="chip gray">Chưa nhập đủ</span>'}</span></div></div>
 ${hold.length?`<div class="lock">Shipper còn giữ <b>${money(sumA(hold.map(i=>i.amount)))}</b> tiền COD chưa nộp (${hold.length} đơn). Chưa tính vào két, nộp sau sẽ tính vào ca đang mở lúc đó.</div>`:''}
 <label class="l" for="sc-leave">Giữ lại trong két cho ca sau</label><input id="sc-leave" class="in mny" type="text" inputmode="numeric" autocomplete="off" value="${fmtIn(c.leave)}" oninput="S.sc.leave=unm(this.value)">
 <label class="l" for="sc-note">Ghi chú <span id="sc-req" style="color:var(--red);font-weight:600"></span></label><input id="sc-note" class="in" placeholder="VD: thối nhầm tiền khách" value="${esc(c.note)}" oninput="S.sc.note=this.value">
 <div class="acts"><button class="btn btn-blue" onclick="doCloseShift()">${ic('check',18)} Chốt ca</button><button class="btn btn-ghost" onclick="closeSheet()">Chưa chốt</button></div>`)}
function scUpd(){const k=scCalc();for(const m of ['cash','bank','wallet']){const el=$('#sd-'+m);if(el)el.innerHTML=dChip(k.r[m])}
 $('#sc-diff').innerHTML=k.ok?dChip(k.diff):'<span class="chip gray">Chưa nhập đủ</span>';$('#sc-req').textContent=k.ok&&Math.abs(k.diff)>=1?'(bắt buộc khi ca lệch)':''}
function addOut(){const t=$('#co-t').value.trim(),a=+unm($('#co-a').value);if(!t||!(a>0)){toast('Nhập nội dung và số tiền chi','err');return}
 curShift().outs.push({t:Date.now(),txt:t,amt:a,by:me().name});logA(`Chi từ két ${money(a)}: ${t}`);renderClose();toast('Đã ghi khoản chi, tiền mặt cần có đã giảm')}
function doCloseShift(){const sh=curShift(),k=scCalc(),c=S.sc;
 if(!k.ok){toast('Nhập đủ số thực nhận cho từng mục','err');return}
 if(Math.abs(k.diff)>=1&&!c.note.trim()){toast('Ca bị lệch: ghi lý do vào ô Ghi chú','err');return}
 const leave=c.leave===''?0:+c.leave;if(leave>+c.cash){toast('Giữ lại trong két không được nhiều hơn số tiền mặt đếm được','err');return}
 sh.exp={cash:k.ex.cash,bank:k.ex.bank,wallet:k.ex.wallet};sh.act={cash:+c.cash,bank:k.ex.bank>0?+c.bank:0,wallet:k.ex.wallet>0?+c.wallet:0};
 sh.diff=k.diff;sh.leave=leave;sh.note=c.note.trim();sh.end=Date.now();sh.endBy=me().name;sh.status='closed';S.shift=null;
 let ck='';if(S.clk[sh.by]){clockOutOf(sh.by);ck=` · đã chấm công ra ca cho ${sh.name}`}
 logA(`Chốt ca ${sh.name}: ${Math.abs(k.diff)<1?'khớp':(k.diff<0?'thiếu ':'thừa ')+money(Math.abs(k.diff))}`);
 closeSheet();render();toast((Math.abs(k.diff)<1?'Đã chốt ca: khớp 100%':`Đã chốt ca: ${k.diff<0?'thiếu':'thừa'} ${money(Math.abs(k.diff))}`)+ck)}
function openShiftDetail(id){const sh=shiftOf(id),e=shiftExp(sh),d=sh.status==='closed';
 sheet(`<h3>Ca ${esc(sh.name)} · ${dayLabel(sh.start)}</h3><p class="sub">${hm(sh.start)} → ${d?hm(sh.end):'đang mở'}${d?' · chốt bởi '+esc(sh.endBy||sh.name):''}</p>
 <div class="card" style="margin-top:12px;padding:4px 14px"><div class="pl"><span>Tiền đầu ca</span><b>${money(sh.open)}</b></div>${sh.openDiff?`<div class="pl" style="border:0"><span class="neg">Lệch so với ca trước lúc mở ca</span><b class="neg">${money(sh.openDiff)}</b></div>`:''}
  <div class="pl"><span>+ Bán tiền mặt</span><b>${money(e.sales.cash)}</b></div><div class="pl"><span>− Chi từ két</span><b>${money(e.out)}</b></div>${sh.outs.map(o=>`<div class="pl" style="padding:3px 0 3px 12px;font-size:13px;border:0"><span class="muted">${esc(o.txt)} · ${hm(o.t)}</span><span>${money(o.amt)}</span></div>`).join('')}
  <div class="pl"><span>Chuyển khoản</span><b>${money(e.bank)}</b></div><div class="pl" style="border:0"><span>Ví điện tử</span><b>${money(e.wallet)}</b></div></div>
 ${d?`<div class="card" style="margin-top:10px;padding:4px 14px"><div class="pl"><span>Tiền mặt cần có / đếm được</span><span>${money(sh.exp.cash)} / <b>${money(sh.act.cash)}</b></span></div>${sh.exp.bank>0?`<div class="pl"><span>Chuyển khoản ghi / nhận</span><span>${money(sh.exp.bank)} / <b>${money(sh.act.bank)}</b></span></div>`:''}${sh.exp.wallet>0?`<div class="pl"><span>Ví ghi / nhận</span><span>${money(sh.exp.wallet)} / <b>${money(sh.act.wallet)}</b></span></div>`:''}
  <div class="pl" style="border:0"><span>Kết quả</span>${dChip(sh.diff)}</div></div>
  ${sh.note?`<div class="hint" style="margin-top:10px">📝 ${esc(sh.note)}</div>`:''}<div class="hint" style="margin-top:10px">Để lại trong két cho ca sau: <b>${money(sh.leave)}</b></div>
  ${sh.late?`<div class="lock">Có ${sh.late} hóa đơn bị sửa / hủy sau khi chốt ca này. Số liệu chốt giữ nguyên, chỉ để đối chiếu.</div>`:''}`:''}
 <div class="acts"><button class="btn btn-ghost" onclick="closeSheet()">Đóng</button></div>`)}
function vShifts(){const done=S.shifts.filter(x=>x.status==='closed').sort((a,b)=>b.end-a.end),bad=done.filter(x=>Math.abs(x.diff)>=1);
 return `<div class="rcard"><h3>Ca thu ngân ${NW}</h3><p class="rsub">Mỗi ca một người giữ két: mở ca đếm tiền lẻ, chốt ca đếm tiền thực tế. Lệch thì biết ngay lệch ở ca nào, của ai.</p>
  <div style="margin-top:12px">${shiftBar()}</div>
  <p class="rmuted" style="font-size:13.5px;margin-top:12px">${done.length} ca đã chốt${bad.length?` · <b style="color:var(--red)">${bad.length} ca lệch</b>`:''}</p>
  ${done.length?`<div class="list" style="margin-top:6px">${done.slice(0,8).map(x=>`<button class="row" onclick="openShiftDetail(${x.id})"><div class="tx"><b>${esc(x.name)} · ${dayLabel(x.start)}</b><span>${hm(x.start)}–${hm(x.end)} · doanh thu ${money(shiftExp(x).revenue)}</span></div>${dChip(x.diff)}</button>`).join('')}</div>`:''}</div>
 <div class="hint"><b>Chốt sổ cả ngày</b> bên dưới là bước quản lý đối chiếu lần cuối: cộng các ca và so với sao kê ngân hàng.</div>`}

/* ---------- SỬA / HỦY HÓA ĐƠN ĐÃ THANH TOÁN ---------- */
function openInv(code){const i=INV.find(x=>x.code===code)||VOIDED.find(x=>x.code===code);if(!i)return;const v=i.void,sh=i.shift&&shiftOf(i.shift);
 sheet(`<h3>${i.code} ${v?'<span class="chip out">Đã hủy</span>':''}</h3><p class="sub">${dayLabelOff(i.day)} · ${hhmm(i)} · ${esc(i.table)}${sh?' · ca '+esc(sh.name):''}</p>
 <div class="list" style="margin-top:12px">${i.lines.map(l=>`<div class="row" style="min-height:0;padding:10px 14px"><div class="tx"><b style="font-size:15px">${esc(l.name)}</b><span>${l.qty} × ${money(l.price)}</span></div><b>${money(l.qty*l.price)}</b></div>`).join('')}</div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><span class="chip gray">${METHODS[i.method]}</span><b style="font-size:20px;${v?'text-decoration:line-through;color:var(--muted)':''}">${money(i.amount)}</b></div>
 ${v?`<div class="lock" style="background:var(--red-soft);color:var(--red)">Hủy bởi ${esc(v.by)} lúc ${hm(v.t)} · lý do: ${esc(v.reason)} · ${REF[v.refund]}</div>`:''}
 ${(i.edits||[]).map(e=>`<div class="logr">✏ ${esc(e.by)} sửa lúc ${hm(e.t)}: ${money(e.fromAmt)} → ${money(e.toAmt)}${e.fromMethod!==e.toMethod?' · '+METHODS[e.fromMethod]+' → '+METHODS[e.toMethod]:''}<small>Lý do: ${esc(e.reason)}</small></div>`).join('')}
 <div class="acts">${v?'':(can('inv')?`<button class="btn btn-ghost" onclick="openInvEdit('${i.code}')">✏ Sửa hóa đơn</button><button class="btn btn-danger" onclick="openInvVoid('${i.code}')">🗑 Hủy hóa đơn</button>`:`<div class="lock" style="margin:0">🔒 Vai trò ${ROLES[me().role]} chưa được bật quyền “Sửa / hủy hóa đơn đã thanh toán”. Nhờ quản lý hoặc chủ.</div>`)}<button class="btn btn-ghost" onclick="closeSheet()">Đóng</button></div>`)}
function openInvEdit(code){if(!need('inv'))return;const i=INV.find(x=>x.code===code);S.ie={code,lines:i.lines.map(l=>({name:l.name,price:l.price,qty:l.qty})),method:i.method,m0:i.method,a0:i.amount,reason:''};renderIE()}
function renderIE(){const e=S.ie,tot=sumA(e.lines.map(l=>l.price*l.qty)),d=tot-e.a0;
 sheet(`<h3>Sửa hóa đơn ${e.code}</h3><p class="sub">Mọi thay đổi được ghi lại: ai sửa, lúc nào, vì sao.</p>
 <div class="list" style="margin-top:12px">${e.lines.map((l,k)=>`<div class="row" style="min-height:0;padding:10px 14px"><div class="tx"><b style="font-size:15px">${esc(l.name)}</b><span>${money(l.price)}</span></div><div class="mini"><button onclick="ieQ(${k},-1)" aria-label="Bớt">−</button><span>${l.qty}</span><button onclick="ieQ(${k},1)" aria-label="Thêm">+</button></div></div>`).join('')}</div>
 <label class="l">Hình thức thanh toán</label><div class="seg">${Object.entries(METHODS).map(([k,v])=>`<button class="sg ${e.method===k?'on plain':''}" onclick="S.ie.method='${k}';renderIE()">${v}</button>`).join('')}</div>
 <div class="pl tot"><span>Tổng mới</span><span style="color:var(--blue)">${money(tot)}</span></div>${d?`<p class="hint">${d<0?'Cần hoàn lại khách '+money(-d):'Khách cần trả thêm '+money(d)}</p>`:''}
 <label class="l" for="ie-r">Lý do sửa (bắt buộc)</label><input id="ie-r" class="in" value="${esc(e.reason)}" oninput="S.ie.reason=this.value" placeholder="VD: nhập nhầm số lượng">
 <div class="acts"><button class="btn btn-blue" onclick="saveIE()">Lưu sửa</button><button class="btn btn-ghost" onclick="openInv('${e.code}')">Quay lại</button></div>`)}
function ieQ(k,d){const l=S.ie.lines[k];l.qty=Math.max(0,l.qty+d);renderIE()}
function saveIE(){const e=S.ie,i=INV.find(x=>x.code===e.code),tot=sumA(e.lines.map(l=>l.price*l.qty));
 if(!e.reason.trim()){toast('Nhập lý do sửa','err');return}if(tot<=0){toast('Hóa đơn không còn món nào: hãy dùng “Hủy hóa đơn”','err');return}
 if(tot===e.a0&&e.method===e.m0){toast('Chưa có thay đổi nào','err');return}
 (i.edits=i.edits||[]).push({t:Date.now(),by:me().name,reason:e.reason.trim(),fromAmt:e.a0,toAmt:tot,fromMethod:e.m0,toMethod:e.method});
 i.lines=e.lines.filter(l=>l.qty>0);i.amount=tot;i.method=e.method;const sh=shiftOf(i.shift);if(sh&&sh.status==='closed')sh.late=(sh.late||0)+1;
 logA(`Sửa hóa đơn ${i.code}: ${money(e.a0)} → ${money(tot)}${e.m0!==e.method?` · ${METHODS[e.m0]} → ${METHODS[e.method]}`:''} · lý do: ${e.reason.trim()}`);
 closeSheet();render();toast('Đã sửa hóa đơn và ghi vào nhật ký')}
function openInvVoid(code){if(!need('inv'))return;const i=INV.find(x=>x.code===code);S.iv={code,reason:'',refund:i.method==='cash'?'cash':'bank'};renderIV()}
function renderIV(){const v=S.iv,i=INV.find(x=>x.code===v.code),cs=curShift(),Q=['Khách đổi ý / không nhận','Làm sai món, đã làm lại','Nhập nhầm đơn','Khách khiếu nại'];
 sheet(`<h3>Hủy hóa đơn ${v.code}</h3><p class="sub">${money(i.amount)} · ${METHODS[i.method]}. Hóa đơn không bị xóa mất, chuyển sang danh sách “đã hủy”.</p>
 <label class="l">Lý do (bắt buộc)</label><div class="unitchips">${Q.map(q=>`<button class="u" style="padding:7px 12px;font-size:13.5px;${v.reason===q?'border-color:var(--blue);color:var(--blue)':''}" onclick="S.iv.reason='${q}';renderIV()">${q}</button>`).join('')}</div>
 <input id="iv-r" class="in" style="margin-top:8px" placeholder="Hoặc tự nhập lý do" value="${esc(v.reason)}" oninput="S.iv.reason=this.value">
 <label class="l">Hoàn tiền cho khách</label><div class="seg">${Object.entries(REF).map(([k,l])=>`<button class="sg s ${v.refund===k?'on plain':''}" onclick="S.iv.refund='${k}';renderIV()">${l}</button>`).join('')}</div>
 ${v.refund==='cash'?`<p class="hint" style="margin-top:8px">${i.shift===S.shift&&i.method==='cash'?'Hóa đơn thuộc ca đang mở nên trừ thẳng khỏi doanh thu ca.':cs?'Tiền hoàn lấy từ két của ca đang mở ('+esc(cs.name)+') và ghi thành khoản chi.':'Cần mở ca thu ngân trước để hoàn tiền mặt.'}</p>`:''}
 <div class="acts"><button class="btn btn-danger" onclick="saveIV()">Hủy hóa đơn</button><button class="btn btn-ghost" onclick="openInv('${v.code}')">Quay lại</button></div>`)}
function saveIV(){const v=S.iv,i=INV.find(x=>x.code===v.code),r=v.reason.trim();
 if(!r){toast('Nhập lý do hủy','err');return}
 const ext=v.refund==='cash'&&(i.shift!==S.shift||i.method!=='cash');if(ext&&!S.shift){toast('Cần mở ca thu ngân trước để hoàn tiền mặt','err');return}
 INV.splice(INV.indexOf(i),1);i.void={t:Date.now(),by:me().name,reason:r,refund:v.refund};VOIDED.unshift(i);
 if(ext)curShift().outs.push({t:Date.now(),txt:'Hoàn tiền hóa đơn '+i.code,amt:i.amount,by:me().name});
 const sh=shiftOf(i.shift);if(sh&&sh.status==='closed')sh.late=(sh.late||0)+1;
 logA(`Hủy hóa đơn ${i.code} (${money(i.amount)}) · ${REF[v.refund]} · lý do: ${r}`);closeSheet();render();toast('Đã hủy hóa đơn, doanh thu đã trừ và ghi vào nhật ký')}

/* ---------- CHẤM CÔNG & LƯƠNG (gộp với tài khoản) ---------- */
const hoursD=(a,d)=>((S.work[a.id]&&S.work[a.id][d])||0)+(d===0&&S.clk[a.id]?(Date.now()-S.clk[a.id])/36e5:0);
const hoursP=a=>sumA(PERS[S.per].map(d=>hoursD(a,d)));
const daysP=a=>PERS[S.per].filter(d=>hoursD(a,d)>0).length;
const payAccts=()=>S.accts.filter(a=>a.pay&&(a.on||hoursP(a)>0));
function staffPay(a){const p=a.pay;if(!p)return 0;return p.type==='month'?p.rate/30*PDAYS():p.type==='day'?p.rate*daysP(a):p.rate*hoursP(a)}
const staffCost=()=>sumA(payAccts().map(staffPay));
const fh=h=>(Math.round(h*10)/10).toLocaleString('vi-VN');
function clockCard(){const u=me();if(!can('clock'))return '';const st=S.clk[u.id];
 return `<div class="card" style="margin-top:14px"><b>🕒 Chấm công ${NW}</b>${st?`<p class="sub" style="margin:4px 0 10px">Đang làm từ <b>${hm(st)}</b> · đã ${dur(Date.now()-st)}</p><button class="btn btn-ghost" onclick="clockOut()">Ra ca</button><button class="link" onclick="demoTua()">(chỉ demo) tua nhanh thêm 1 giờ</button>`:`<p class="sub" style="margin:4px 0 10px">Chưa vào ca. Giờ làm sẽ tự tính vào bảng lương.</p><button class="btn btn-blue" onclick="clockIn()">Vào ca</button>`}</div>`}

function vDon(){
 const open=S.orders.filter(o=>o.status!=='done'&&o.status!=='cancel'),td=INV.filter(i=>i.day===0);
 return `${shiftBar()}<div class="bigbtns"><button class="btn btn-blue" onclick="newTake()">${ic('plus',18)} Đơn Mang Về</button><button class="btn btn-orange" onclick="openShipNew()">${ic('plus',18)} Đơn Giao Ship</button></div>
 <div class="segw"><button class="${S.home==='orders'?'on':''}" onclick="S.home='orders';render()">Đơn đang mở (${open.length}) ${NW}</button><button class="${S.home==='tables'?'on':''}" onclick="S.home='tables';render()">Phòng bàn</button></div>
 ${S.home==='tables'?vTables():vOrders(open,td)}`}
function vOrders(open,td){
 const F=[['all','Tất cả',()=>true],['new','Chưa báo bếp',o=>o.status==='new'||(o.type==='table'&&o.lines.some(l=>l.st==='new'))],['cook','Đang làm',o=>o.status==='cook'||(o.type==='table'&&o.lines.some(l=>l.st==='cook'))],['ready','Xong',o=>o.status==='ready'],['ship','Đang giao',o=>o.status==='ship']];
 const f=F.find(x=>x[0]===S.dflt)||F[0],rk={new:0,ready:1,cook:2,ship:3,open:4};
 const rows=open.filter(f[2]).sort((a,b)=>rk[a.status]-rk[b.status]||a.t-b.t);
 return `<div class="tiles"><div class="tile"><span>Đơn hôm nay</span><b>${td.length}</b></div><div class="tile"><span>Doanh thu hôm nay</span><b>${money(sumA(td.map(i=>i.amount)))}</b></div></div>
 <div class="pills">${F.map(([k,l,fn])=>`<button class="pill ${S.dflt===k?'on':''}" onclick="S.dflt='${k}';render()">${l} (${open.filter(fn).length})</button>`).join('')}</div>
 ${rows.length?rows.map(oCard).join(''):'<div class="card empty">Không có đơn nào ở mục này</div>'}
 <p class="hint">Quán bán mang về là chính nên màn hình đầu là <b>danh sách đơn</b>, xếp theo việc cần làm. Sơ đồ bàn vẫn còn ở nút “Phòng bàn”.</p>`}
function oCard(o){const late=o.status!=='ready'&&o.status!=='ship'&&mins(o.t)>15&&o.lines.some(l=>l.st!=='done');
 let act='';
 if(o.type==='table')act=`<button class="btn btn-blue btn-sm" onclick="openCheckout(${o.id})">Thanh toán</button>`;
 else if(o.status==='new')act=isShipT(o)?(can('confirm')?`<button class="btn btn-orange btn-sm" onclick="openConfirm(${o.id})">📞 Xác nhận đơn</button>`:'<span class="chip low">Chờ quản lý xác nhận</span>'):`<button class="btn btn-kit btn-sm" onclick="sendK(${o.id})">Báo bếp</button>`;
 else if(o.status==='ready')act=isShipT(o)?`<button class="btn btn-orange btn-sm" onclick="openAssign(${o.id})">Giao shipper</button>`:(o.paid?`<button class="btn btn-green btn-sm" onclick="pickedUp(${o.id})">Khách đã lấy</button>`:`<button class="btn btn-blue btn-sm" onclick="openCheckout(${o.id})">Thu tiền</button>`);
 else if(o.status==='ship')act=`<button class="btn btn-green btn-sm" onclick="delivered(${o.id})">Đã giao xong</button>`;
 return `<div class="ocard ${late?'late':''}"><button class="ohead" onclick="openOrd(${o.id})"><span class="tbadge ${TYC[o.type]}">${tName(o)}</span><b>${o.cust&&o.cust.name?esc(o.cust.name):o.code}</b><span class="tm">${late?'⚠ ':''}${ago2(o.t)}</span>${ic('chev',16)}</button>
 <div class="obody">${o.lines.map(l=>l.qty+' '+esc(l.name)).join(', ')||'Chưa có món'}${o.pickAt?` · <b>hẹn lấy ${esc(o.pickAt)}</b>`:''}${o.ship?` · ship ${money(o.ship.fee)}`:''}</div>
 <div class="oacts"><div><span class="chip ${stCls(o)}">${stName(o)}</span> <b style="font-size:15px;margin-left:4px">${money(oNet(o))}</b>${o.paid?' <span class="chip ok" style="padding:2px 8px;font-size:11.5px">Đã trả</span>':''}</div>${act}</div></div>`}
function vTables(){const busy=t=>S.orders.find(o=>o.type==='table'&&o.table===t.id&&o.status==='open');
 const nb=S.tables.filter(busy).length,rows=S.tables.filter(t=>(S.tarea==='all'||t.area===S.tarea)&&(S.tflt==='all'||(S.tflt==='busy')===!!busy(t)));
 const take=S.orders.filter(o=>o.type==='take'&&o.status!=='done'&&o.status!=='cancel');
 return `<div class="pills">${[['all','Tất cả',S.tables.length],['busy','Có khách',nb],['free','Trống',S.tables.length-nb]].map(([k,l,n])=>`<button class="pill ${S.tflt===k?'on':''}" onclick="S.tflt='${k}';render()">${l} (${n})</button>`).join('')}</div>
 ${take.length?`<p class="gtitle" style="margin:6px 4px 0">🛍 Đơn mang về đang mở (${take.length})</p><div class="pills">${take.map(o=>`<button class="tkchip" onclick="openOrd(${o.id})"><b>${o.cust&&o.cust.name?esc(o.cust.name):'Khách mang về'}</b><span>${o.code} · ${money(oNet(o))}</span></button>`).join('')}</div>`:''}
 <div class="pills">${['all',...S.areas].map(a=>`<button class="pill ${S.tarea===a?'on':''}" onclick="S.tarea='${a.replace(/'/g,"\\'")}';render()">${a==='all'?'Tất cả khu vực':esc(a)}</button>`).join('')}</div>
 <div class="tgrid">${rows.map(t=>{const o=busy(t);return o?`<button class="tb busy" onclick="openOrd(${o.id})"><div class="h"><div><b>${esc(t.name)}</b><br><small>${esc(t.area)}</small></div><span class="g">${ic('users',12)} ${o.guests||1}</span></div><div class="f"><span>⏱ ${ago2(o.t)} · ${oQty(o)} món</span><b style="color:var(--blue)">${money(oNet(o))}</b></div></button>`
  :`<button class="tb" onclick="openTable(${t.id})"><div class="h"><div><b>${esc(t.name)}</b><br><small>${esc(t.area)}</small></div><span class="g">${ic('users',12)} ${t.seats}</span></div><div class="f"><span style="color:var(--green);font-weight:700">${ic('utensils',13)} Bàn trống</span><span class="muted">Chạm để mở</span></div></button>`}).join('')}</div>`}
function openTable(id){if(!need('order'))return;const o=newOrder('table',{table:id,guests:1});openOrd(o.id)}
function newTake(){if(!need('order'))return;const o=newOrder('take');openOrd(o.id)}
function openOrd(id){S.ord=id;S.oq='';S.ocat='Tất cả';render(false);window.scrollTo(0,0)}
function closeOrd(){const o=oById(S.ord);if(o&&!o.lines.length&&o.status!=='done'){S.orders=S.orders.filter(x=>x!==o)}S.ord=null;render(false);window.scrollTo(0,0)}
function sendK(id){const o=oById(id),n=o.lines.filter(l=>l.st==='new');if(isShipT(o)&&o.status==='new'){if(can('confirm'))openConfirm(id);else toast('Đơn giao hàng phải được quản lý gọi khách xác nhận rồi mới vào bếp','err');return}if(!need('kit'))return;if(!n.length){toast('Không có món mới để báo bếp','err');return}
 n.forEach(l=>l.st='cook');if(o.status==='new')o.status='cook';render();toast(`Đã báo bếp ${sumA(n.map(l=>l.qty))} món · ${tName(o)} ${o.code}`)}
function openConfirm(id){const o=oById(id);if(!can('confirm')){toast('Chỉ quản lý được xác nhận đơn','err');return}const c=o.cust||{};
 sheet(`<h3>Xác nhận đơn ${CHN[o.type]} #${o.code.slice(-3)}</h3><p class="sub">Gọi cho khách kiểm tra đúng người, đúng số, đúng món rồi mới xác nhận. Xác nhận xong đơn mới vào bếp.</p>
 <div class="card" style="margin-top:12px;padding:12px 14px"><b style="font-size:16px">${esc(c.name||'Khách')}</b><div class="muted" style="font-size:14px">${esc(c.phone||'Chưa có số')} · ${esc(c.addr||'')}</div>
 <div style="font-size:14px;margin-top:6px">${o.lines.map(l=>l.qty+' × '+esc(l.name)).join('<br>')}</div>${o.note?`<div style="font-size:13px;color:var(--orange);margin-top:4px">📝 ${esc(o.note)}</div>`:''}
 <div class="pl" style="border:0;padding-bottom:0"><span>Tổng thu khách${o.type==='ctv'?' · CTV: '+esc(o.by):''}</span><b>${money(oNet(o)+(o.ship?o.ship.fee:0))}</b></div></div>
 <div class="acts">${c.phone?`<a class="btn btn-ghost" href="tel:${unm(c.phone)}">${ic('phone',18)} Gọi khách ${esc(c.phone)}</a>`:''}
 <button class="btn btn-orange" onclick="confirmO(${id})">${ic('check',18)} Đã gọi, đúng khách · Gửi bếp</button>
 <button class="btn btn-danger" onclick="rejectO(${id})">Từ chối đơn (khách không nghe máy, đặt nhầm…)</button></div>`)}
function confirmO(id){const o=oById(id);o.lines.forEach(l=>{if(l.st==='new')l.st='cook'});o.status='cook';o.okBy=me().name;logA(`Xác nhận đơn ${CHN[o.type]} ${o.code} (đã gọi khách ${o.cust&&o.cust.phone?o.cust.phone:''})`);closeSheet();render();toast('Đã xác nhận, đơn đã vào bếp')}
function rejectO(id){const o=oById(id);sheet(`<h3>Từ chối đơn #${o.code.slice(-3)}</h3><label class="l" for="rj-r">Lý do</label><input id="rj-r" class="in" placeholder="VD: gọi 3 lần không nghe máy">
 <div class="acts"><button class="btn btn-danger" onclick="doReject(${id})">Từ chối đơn</button><button class="btn btn-ghost" onclick="openConfirm(${id})">Quay lại</button></div>`)}
function doReject(id){const o=oById(id),r=$('#rj-r').value.trim();if(!r){toast('Nhập lý do','err');return}o.status='cancel';logA(`Từ chối đơn ${CHN[o.type]} ${o.code} · lý do: ${r}`);closeSheet();render();toast('Đã từ chối đơn')}
function pickedUp(id){const o=oById(id);o.status='done';render();toast(`Đơn ${o.code} hoàn tất`)}

/* ---------- MÀN HÌNH GỌI MÓN ---------- */
function vOrder(o){
 if(!o){S.ord=null;return vDon()}
 const nNew=sumA(o.lines.filter(l=>l.st==='new').map(l=>l.qty)),ship=isShipT(o),closed=o.status==='done'||o.status==='cancel';
 const sub=o.type==='table'?`${(S.tables.find(t=>t.id===o.table)||{}).area||''} · ${o.guests||1} khách · mở ${ago2(o.t)}`:o.cust?[o.cust.name,o.cust.phone].filter(Boolean).map(esc).join(' · '):'Khách mang về';
 return `<div class="otop"><button class="iconbtn" onclick="closeOrd()" aria-label="Quay lại">${ic('back',20)}</button><div class="t"><b>${tName(o)} <span class="code">#${o.code.slice(-3)}</span></b><small>${sub}</small></div>
  ${closed?'':`<button class="btn btn-ghost btn-sm" style="padding:0 10px" onclick="openMove(${o.id})">⇄ Chuyển/Gộp</button><button class="iconbtn" style="color:var(--red)" onclick="askCancel(${o.id})" aria-label="Hủy đơn">${ic('x',18)}</button>`}</div>
 ${o.type==='take'?`<button class="oinfo" onclick="openTakeInfo(${o.id})">${ic('edit',15)} ${o.cust&&o.cust.name?esc(o.cust.name):'Thêm tên khách'} · ${o.pickAt?'hẹn lấy '+esc(o.pickAt):'đặt giờ hẹn lấy'} ${NW}</button>`:''}
 ${ship?`<div class="oinfo">${ic('truck',15)} ${esc(o.cust.addr||'')} · ${o.ship.km} km · ship ${money(o.ship.fee)} · ${o.ship.pay==='cod'?'Thu hộ tiền mặt (COD)':'Chuyển khoản VietQR'}${o.note?' · '+esc(o.note):''}</div>`:''}
 ${o.lines.length?`<div class="card" style="padding:6px 14px"><div class="hd2" style="padding-top:8px"><h3>Món trong đơn (${oQty(o)})</h3><b>${money(oSub(o))}</b></div>${o.lines.map((l,k)=>`<div class="ol"><div class="tx"><b>${esc(l.name)}</b><span>${money(lineUnit(l))}${l.tops.length?' · '+l.tops.map(t=>esc(t.name)).join(', '):''}${l.note?' · “'+esc(l.note)+'”':''}</span><br><span class="chip ${l.st==='new'?'low':l.st==='cook'?'gray':'ok'}" style="padding:1px 8px;font-size:11.5px;margin-top:3px">${l.st==='new'?'Chưa báo bếp':l.st==='cook'?'Bếp đang làm':'Đã xong'}</span></div>
  ${closed?`<b>× ${l.qty}</b>`:`<div class="mini"><button onclick="lineQ(${o.id},${k},-1)" aria-label="Bớt">−</button><span>${l.qty}</span><button onclick="lineQ(${o.id},${k},1)" aria-label="Thêm">+</button></div>`}</div>`).join('')}</div>`:''}
 ${closed?'':`<div class="search">${ic('search',18)}<input id="oq" placeholder="Tìm món nhanh (VD: pho bo, lau thai…)" value="${esc(S.oq)}" oninput="S.oq=this.value;omenu()" aria-label="Tìm món"></div>
 <div class="pills">${['Tất cả',...S.cats].map((c,k)=>`<button class="pill ${S.ocat===c?'on':''}" onclick="S.ocat=['Tất cả',...S.cats][${k}];render()">${esc(c)}</button>`).join('')}</div>
 <div class="mgrid" id="omenu">${menuCards(o)}</div>`}
 ${closed?'':`<div class="obar"><div class="sum"><small>Tạm tính (${oQty(o)} món)</small><b>${money(oSub(o))}</b></div>
  <button class="btn btn-kit" onclick="sendK(${o.id})" ${nNew?'':'disabled'}>Báo bếp (${nNew})</button>
  ${ship?`<button class="btn btn-orange" onclick="shipDone(${o.id})">Gửi đơn</button>`:`<button class="btn btn-blue" onclick="openCheckout(${o.id})" ${o.lines.length?'':'disabled'}>${o.paid?'Đã trả':'Thanh toán'}</button>`}</div>`}`}
function menuCards(o){const q=S.oq.trim().toLowerCase(),nq=q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
 const list=S.menu.filter(m=>(S.ocat==='Tất cả'||m.cat===S.ocat)&&(!q||m.name.toLowerCase().includes(q)||m.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').includes(nq)));
 return list.length?list.map(m=>{const n=sumA(o.lines.filter(l=>l.mid===m.id).map(l=>l.qty));
  return `<div class="mi ${m.on?'':'off'}" role="button" tabindex="0" onclick="addM(${o.id},${m.id})">${n?`<span class="inc">${n}</span>`:''}<span class="qt ${m.st}">${m.st==='bep'?'Bếp':'Bar'}</span><span class="em">${m.em}</span><b>${esc(m.name)}</b>
  <div class="pr"><span>${m.on?money(m.price):'Hết món'}</span><button class="op" onclick="event.stopPropagation();openOpt(${o.id},${m.id})" aria-label="Tùy chọn ${esc(m.name)}">${ic('dots',16)}</button></div></div>`}).join(''):'<div class="card empty" style="grid-column:1/-1">Không tìm thấy món</div>'}
function omenu(){const o=oById(S.ord);if(o)$('#omenu').innerHTML=menuCards(o)}
function addM(oid,mid,qty,tops,note){if(!need('order'))return;const o=oById(oid),m=mById(mid);if(!m.on){toast(m.name+' đang hết món','err');return}
 const ex=!tops&&!note&&o.lines.find(l=>l.mid===mid&&l.st==='new'&&!l.tops.length&&!l.note);
 if(ex)ex.qty+=qty||1;else o.lines.push(mkLine(mid,qty||1,'new',tops,note));
 if(o.status==='ready'||o.status==='done')o.status='cook';render()}
function openOpt(oid,mid){if(!need('order'))return;const m=mById(mid);
 sheet(`<h3>${m.em} ${esc(m.name)}</h3><p class="sub">${money(m.price)} / ${esc(m.unit)}</p>
 <label class="l">Số lượng</label><div class="stepper" style="width:150px"><button onclick="optQ(-1)">−</button><input id="op-q" type="number" min="1" value="1" aria-label="Số lượng"><button onclick="optQ(1)">+</button></div>
 ${S.tops.length?`<label class="l">Topping / thêm</label><div class="unitchips">${S.tops.map(t=>`<label class="u" style="padding:8px 14px;cursor:pointer"><input type="checkbox" value="${t.id}" class="op-t"> ${esc(t.name)}${t.price?' +'+money(t.price):''}</label>`).join('')}</div>`:''}
 <label class="l" for="op-n">Ghi chú cho bếp</label><input id="op-n" class="in" placeholder="VD: ít cay, không hành">
 <div class="acts"><button class="btn btn-blue" onclick="optAdd(${oid},${mid})">Thêm vào đơn</button><button class="btn btn-ghost" onclick="closeSheet()">Đóng</button></div>`)}
function optQ(d){const e=$('#op-q');e.value=Math.max(1,(+e.value||1)+d)}
function optAdd(oid,mid){const q=Math.max(1,Math.floor(+$('#op-q').value||1)),tops=[...document.querySelectorAll('.op-t:checked')].map(x=>S.tops.find(t=>t.id===+x.value)),n=$('#op-n').value.trim();closeSheet();addM(oid,mid,q,tops.length?tops:null,n||null)}
function lineQ(oid,k,d){if(d>0&&!need('order'))return;const o=oById(oid),l=o.lines[k];
 if(d>0){l.qty++;render();return}
 if(l.st==='new'){l.qty--;if(l.qty<=0)o.lines.splice(k,1);render();return}
 if(!can('cancel')){toast('Món đã báo bếp — bạn không có quyền hủy, nhờ quản lý','err');return}
 sheet(`<h3>Hủy 1 ${esc(l.name)}?</h3><p class="sub">Món đã báo bếp. Chọn lý do để lưu vào báo cáo “Món đã hủy” và nhật ký.</p>
 <div class="list" style="margin-top:12px">${['Khách đổi ý','Gọi nhầm món','Món ra chậm, khách không chờ','Món bị lỗi / đổ vỡ'].map(r=>`<button class="row" onclick="doCancelLine(${oid},${k},'${r}')"><div class="tx"><b>${r}</b></div>${ic('chev',18)}</button>`).join('')}</div>
 <div class="acts"><button class="btn btn-ghost" onclick="closeSheet()">Không hủy</button></div>`)}
function doCancelLine(oid,k,reason){const o=oById(oid),l=o.lines[k],h=new Date().getHours();
 CANC.push({day:0,hour:h,item:l.name,qty:1,whole:false,reason,by:me().name});logA(`Hủy 1 ${l.name} · ${tName(o)} ${o.code} · lý do: ${reason}`);
 l.qty--;if(l.qty<=0)o.lines.splice(k,1);refreshO(o);closeSheet();render();toast('Đã hủy món và ghi lại lý do')}
function askCancel(id){const o=oById(id);
 if(!o.lines.length){closeOrd();return}
 if(o.lines.some(l=>l.st!=='new')&&!can('cancel')){toast('Đơn có món đã báo bếp — bạn không có quyền hủy, nhờ quản lý','err');return}
 sheet(`<h3>Hủy cả đơn ${o.code}?</h3><p class="sub">${oQty(o)} món · ${money(oNet(o))}. Đơn sẽ lưu lại với trạng thái “Đã hủy”, không xóa mất.</p>
 <label class="l" for="cx-r">Lý do</label><input id="cx-r" class="in" placeholder="VD: khách không đến lấy">
 <div class="acts"><button class="btn btn-danger" onclick="doCancelO(${id})">Hủy đơn</button><button class="btn btn-ghost" onclick="closeSheet()">Không</button></div>`)}
function doCancelO(id){const o=oById(id),r=$('#cx-r').value.trim();if(!r){toast('Nhập lý do hủy','err');return}
 o.status='cancel';CANC.push({day:0,hour:new Date().getHours(),item:o.lines.map(l=>l.name).join(', '),qty:oQty(o),whole:true,reason:r,by:me().name});logA(`Hủy cả đơn ${o.code} (${money(oNet(o))}) · lý do: ${r}`);
 closeSheet();S.ord=null;render(false);toast('Đã hủy đơn và ghi vào nhật ký')}
function openTakeInfo(id){const o=oById(id),c=o.cust||{};
 sheet(`<h3>Khách mang về</h3><label class="l" for="tk-p">Số điện thoại</label><input id="tk-p" class="in" inputmode="tel" value="${esc(c.phone||'')}" oninput="custHint('tk')"><div id="tk-hint"></div>
 <label class="l" for="tk-n">Tên khách</label><input id="tk-n" class="in" value="${esc(c.name||'')}" placeholder="VD: Anh Nam">
 <label class="l" for="tk-t">Hẹn giờ lấy</label><input id="tk-t" class="in" type="time" value="${esc(o.pickAt||'')}">
 <div class="acts"><button class="btn btn-blue" onclick="saveTake(${id})">Lưu</button></div>`)}
function saveTake(id){const o=oById(id);o.cust={name:$('#tk-n').value.trim(),phone:$('#tk-p').value.trim()};o.pickAt=$('#tk-t').value||null;closeSheet();render()}
function openMove(id){const o=oById(id),free=S.tables.filter(t=>!S.orders.some(x=>x.type==='table'&&x.table===t.id&&x.status==='open')),others=S.orders.filter(x=>x!==o&&x.status!=='done'&&x.status!=='cancel'&&!isShipT(x));
 sheet(`<h3>Chuyển / Gộp đơn</h3><p class="sub">${tName(o)} ${o.code}</p>
 ${o.type==='table'?`<label class="l">Chuyển sang bàn trống</label><div class="unitchips">${free.map(t=>`<button class="u" style="padding:8px 14px" onclick="moveT(${id},${t.id})">${esc(t.name)}</button>`).join('')||'<span class="muted">Hết bàn trống</span>'}</div>`:''}

/* ---------- THANH TOÁN ---------- */
function openCheckout(id){if(!need('pay'))return;if(!S.shift){toast(can('shift')?'Chưa mở ca thu ngân: bấm “Mở ca” ở thanh phía trên rồi mới thu tiền':'Chưa mở ca thu ngân: nhờ thu ngân hoặc quản lý mở ca','err');return}const o=oById(id);if(!o.lines.length){toast('Đơn chưa có món','err');return}
 if(o.paid){toast('Đơn này đã thanh toán rồi');return}
 S.pay={id,disc:o.disc||0,method:'cash',given:'',print:true};renderPay()}
function renderPay(){const p=S.pay,o=oById(p.id),sub=oSub(o),d=Math.min(sub,p.disc),tot=sub-d,giv=+unm(p.given),cd=can('disc');
 sheet(`<h3>Thanh toán · ${tName(o)}</h3><p class="sub">${o.code} · ${oQty(o)} món</p>
 <div class="pl"><span>Tạm tính</span><b>${money(sub)}</b></div>
 <div class="pl" style="flex-wrap:wrap"><span>Giảm giá</span>${cd?`<div class="unitchips">${[0,.05,.1].map(r=>`<button class="u" style="padding:6px 12px;${Math.round(sub*r)===d?'border-color:var(--blue);color:var(--blue)':''}" onclick="S.pay.disc=${Math.round(sub*r)};renderPay()">${r?r*100+'%':'Không'}</button>`).join('')}<input class="in mny" style="width:110px;min-height:38px" type="text" inputmode="numeric" placeholder="Số tiền" value="${d&&![.05,.1].some(r=>Math.round(sub*r)===d)?fmtIn(d):''}" onchange="S.pay.disc=+unm(this.value);renderPay()" aria-label="Giảm số tiền"></div>`:`<span class="lock" style="margin:0">🔒 Vai trò của bạn không được giảm giá</span>`}</div>
 <div class="pl tot"><span>Khách cần trả</span><span style="color:var(--blue);font-size:22px">${money(tot)}</span></div>
 <label class="l">Hình thức</label><div class="seg">${Object.entries(METHODS).map(([k,v])=>`<button class="sg ${p.method===k?'on plain':''}" onclick="S.pay.method='${k}';renderPay()">${v}</button>`).join('')}</div>
 ${p.method==='cash'?`<label class="l" for="py-g">Khách đưa</label><input id="py-g" class="in mny" type="text" inputmode="numeric" value="${fmtIn(p.given)}" onchange="S.pay.given=unm(this.value);renderPay()" placeholder="${fmtIn(tot)}">
  <div class="unitchips" style="margin-top:8px">${[tot,100000,200000,500000].filter((v,i,a)=>v>=tot&&a.indexOf(v)===i).map(v=>`<button class="u" style="padding:6px 12px" onclick="S.pay.given='${v}';renderPay()">${v===tot?'Vừa đủ':money(v)}</button>`).join('')}</div>
  ${giv?`<div class="pl"><span>Tiền thối lại</span><b style="color:${giv<tot?'var(--red)':'var(--green)'}">${giv<tot?'Còn thiếu '+money(tot-giv):money(giv-tot)}</b></div>`:''}`
 :p.method==='bank'?`<div class="paybox">${fakeQR(tot%997+3,132)}<div><b>Quét VietQR để trả ${money(tot)}</b><small>${esc(S.cfg.bank)}<br>${esc(S.cfg.acc)} · ${esc(S.cfg.accName)}<br>Nội dung: ${o.code}</small></div></div>`:'<p class="hint" style="margin-top:10px">Khách trả bằng Momo / ZaloPay… Thu ngân kiểm tra tin báo rồi bấm xác nhận.</p>'}
 <div class="swrow"><div><b>In hóa đơn</b><span>In bill kèm wifi và lời chào cuối</span></div><label class="sw"><input type="checkbox" ${p.print?'checked':''} onchange="S.pay.print=this.checked"><i></i></label></div>
 <div class="acts"><button class="btn btn-blue" onclick="doCheckout()">Xác nhận đã nhận ${money(tot)}</button><button class="btn btn-ghost" onclick="closeSheet()">Quay lại</button></div>`)}
function doCheckout(){const p=S.pay,o=oById(p.id),sub=oSub(o),d=Math.min(sub,p.disc),tot=sub-d;
 if(p.method==='cash'&&p.given&&+p.given<tot){toast('Khách đưa chưa đủ tiền','err');return}
 o.disc=d;const unsent=o.lines.filter(l=>l.st==='new');unsent.forEach(l=>l.st='cook');
 o.paid=true;o.method=p.method;const warn=pushInv(o,p.method);if(d)logA(`Giảm giá ${money(d)} cho ${tName(o)} ${o.code}`);
 if(o.type==='table'||o.lines.every(l=>l.st==='done'))o.status='done';else if(o.status==='new')o.status='cook';
 closeSheet();S.ord=null;render(false);window.scrollTo(0,0);
 toast(`Đã thu ${money(tot)} · ${METHODS[p.method]}${p.print?' · đang in bill':''}${unsent.length?' · đã báo bếp món còn lại':''}${warn.length?' · ⚠ kho sắp hết '+warn.join(', '):''}`)}
function fakeQR(seed,size){const r=rng(seed*7919+13),n=25,c=size/n;let s='';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8))continue;if(r()<.46)s+=`<rect x="${(x*c).toFixed(1)}" y="${(y*c).toFixed(1)}" width="${c.toFixed(1)}" height="${c.toFixed(1)}"/>`}
 const f=(X,Y)=>`<rect x="${X*c}" y="${Y*c}" width="${7*c}" height="${7*c}"/><rect x="${(X+1)*c}" y="${(Y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(X+2)*c}" y="${(Y+2)*c}" width="${3*c}" height="${3*c}"/>`;
 return `<svg class="qr" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#0f172a" aria-hidden="true">${s}${f(0,0)}${f(n-7,0)}${f(0,n-7)}</svg>`}

function custHint(p){const v=unm($('#'+p+'-p').value),c=v.length>=4&&S.custs.find(x=>x.phone.startsWith(v)||x.phone===v),e=$('#'+p+'-hint');if(!e)return;
 e.innerHTML=c?`<button class="custh" onclick="custFill('${p}','${c.phone}')">👤 Khách quen: <b>${esc(c.name)}</b> · ${c.n} đơn · ${esc(c.addr)} — <u>bấm để điền</u></button>`:''}

function shipBlock(p,km,fee){return `<div class="mapbox"><b>📍 Đo khoảng cách & tính phí ship tự động</b><small>Đơn giá quán: <b>${S.cfg.km0} km đầu = ${money(S.cfg.fee0)}</b>, mỗi km thêm <b>${money(S.cfg.feeKm)}</b></small>
 <div style="display:flex;gap:8px;margin-top:8px"><input id="${p}-l" class="in" style="min-height:44px" placeholder="Dán link Google Maps"><button class="btn btn-sm" style="background:var(--ink);color:#fff;flex:none" onclick="measure('${p}')">Đo & tính ship</button></div>
 <div class="two" style="margin-top:8px"><div><span class="fl">Khoảng cách (km)</span><input id="${p}-k" class="in" style="min-height:44px" type="number" inputmode="decimal" step="0.1" min="0" placeholder="VD: 3.2" value="${km||''}" oninput="kmFee('${p}')"></div><div><span class="fl">Phí ship (đ)</span><input id="${p}-f" class="in mny" style="min-height:44px;color:var(--orange);font-weight:800" type="text" inputmode="numeric" value="${fmtIn(fee||0)}"></div></div></div>`}
function kmFee(p){$('#'+p+'-f').value=fmtIn(shipFee($('#'+p+'-k').value));if(p==='ct'){S.ctvD.km=$('#ct-k').value;S.ctvD.fee=shipFee(S.ctvD.km);ctvSum()}}
function measure(p){const l=$('#'+p+'-l').value.trim();const km=l?(1.2+(l.length%40)/10).toFixed(1):'2.8';$('#'+p+'-k').value=km;kmFee(p);toast(`Bản demo: giả lập đo được ${km} km${l?'':' (chưa dán link nên lấy số mẫu)'}`)}

 sheet(`<h3>${ic('truck',20)} Tạo đơn giao hàng (Shipper)</h3>
 <label class="l" for="sn-p">Số điện thoại</label><input id="sn-p" class="in" inputmode="tel" placeholder="09xx…" oninput="custHint('sn')"><div id="sn-hint"></div>
 <label class="l" for="sn-n">Tên khách hàng *</label><input id="sn-n" class="in" placeholder="VD: Anh Nam - FPT">

function vShip(){
 const isShipper=!can('shipAll'),so=S.orders.filter(o=>isShipT(o)&&(!isShipper||o.shipper===S.me));
 let T=[['todo','Cần xử lý',o=>o.status==='new'||o.status==='cook'],['wait','Chờ nhận',o=>o.status==='ready'],['go','Đang đi giao',o=>o.status==='ship'],['done','Đã giao hôm nay',o=>o.status==='done']];
 if(isShipper){T=T.slice(2);if(S.sflt!=='go'&&S.sflt!=='done')S.sflt='go'}
 const f=T.find(t=>t[0]===S.sflt)||T[0],rows=so.filter(f[2]).sort((a,b)=>a.t-b.t),cnt=k=>so.filter(T.find(t=>t[0]===k)[2]).length;
 const hold={};so.filter(o=>o.status==='done'&&o.cod&&!o.remit).forEach(o=>{const k=o.shipper||0;(hold[k]=hold[k]||[]).push(o)});
 const owe=o=>oNet(o)+(S.cfg.feeTo==='shop'?o.ship.fee:0);
 return `<div class="rcard"><div class="hd2"><div><h3>${isShipper?'Đơn giao của tôi':'Điều phối Giao hàng & Đơn Online'}</h3><p class="rsub" style="font-size:13px">${isShipper?`${cnt('go')} đang giao · ${cnt('done')} đã giao hôm nay · chỉ thấy đơn quán giao cho bạn`:`${cnt('wait')} chờ nhận · ${cnt('go')} đang giao · ${cnt('done')} hoàn tất hôm nay`}</p></div></div>
  ${isShipper?'':`<div class="two" style="margin-top:12px"><button class="btn btn-ghost btn-sm" style="width:100%" onclick="render();toast('Đã làm mới')">↻ Làm mới</button><button class="btn btn-orange btn-sm" style="width:100%" onclick="openShipNew()">${ic('plus',16)} Tạo đơn giao hàng</button></div>`}</div>
 ${Object.keys(hold).length?`<div class="rcard"><h3>Tiền COD shipper đang giữ ${NW}</h3><p class="rsub" style="font-size:13px">Shipper thu tiền mặt của khách, về quán phải nộp lại. Phí ship đang tính cho: <b>${S.cfg.feeTo==='shop'?'quán':'shipper'}</b> (đổi trong Cài đặt).</p>
  ${Object.entries(hold).map(([k,os])=>{const a=S.accts.find(x=>x.id===+k);return `<div class="pl"><span><b>${esc(a?a.name:'Chưa gán')}</b><small>${os.length} đơn: ${os.map(o=>o.code.slice(-3)).join(', ')}</small></span><span style="text-align:right"><b style="color:var(--orange)">${money(sumA(os.map(owe)))}</b><br>${isShipper?'':`<button class="link" style="padding:0" onclick="remit(${k})">Đã nhận tiền</button>`}</span></div>`}).join('')}</div>`:''}
 <div class="pills">${T.map(([k,l])=>`<button class="pill ${S.sflt===k?'on':''}" onclick="S.sflt='${k}';render()">${l} (${cnt(k)})</button>`).join('')}</div>
 ${rows.length?rows.map(o=>{const sh=S.accts.find(a=>a.id===o.shipper);let act='';
  if(isShipper)act=o.status==='ship'&&can('deliver')?`<button class="btn btn-green btn-sm" onclick="delivered(${o.id})">Đã giao xong</button>`:(o.cod?(o.remit?'<span class="chip ok">Đã nộp tiền</span>':'<span class="chip low">Chưa nộp tiền</span>'):'<span class="chip ok">Đã chuyển khoản</span>');
  else if(o.status==='new')act=(can('confirm')?`<button class="btn btn-orange btn-sm" onclick="openConfirm(${o.id})">📞 Xác nhận đơn</button>`:'<span class="chip low">Chờ quản lý xác nhận</span>');
  else if(o.status==='cook')act='<span class="chip gray">Bếp đang làm</span>';

  return `<div class="ocard"><div class="ohead"><span class="tbadge ${TYC[o.type]}">${CHN[o.type]}</span><b>${esc(o.cust.name)} · ${o.code.slice(-3)}</b><span class="tm">${ago2(o.t)}</span></div>
  <div class="obody">${ic('truck',13)} ${esc(o.cust.addr||'')} ${o.cust.phone?'· '+esc(o.cust.phone):''}<br>${o.lines.map(l=>l.qty+' '+esc(l.name)).join(', ')}${o.note?`<br>📝 ${esc(o.note)}`:''}${o.type==='ctv'?`<br>CTV: ${esc(o.by)}`:''}${sh?`<br>Shipper: <b>${esc(sh.name)}</b>`:''}</div>
  <div class="oacts"><div><b>${money(oNet(o)+o.ship.fee)}</b><small class="muted" style="display:block;font-size:12px">gồm ship ${money(o.ship.fee)} · ${o.ship.pay==='cod'?'COD':'VietQR'}</small></div>${act}</div></div>`}).join(''):`<div class="card empty">${ic('pkg',30)}<p style="margin-top:6px;font-weight:700;color:var(--ink2)">Chưa có đơn giao hàng trong mục này.</p><p style="font-size:13px">Khi khách đặt qua link Menu Online hoặc thu ngân tạo đơn giao ship, đơn sẽ hiện tự động tại đây.</p></div>`}`}

/* ---------- BẾP / BAR ---------- */
function vBep(){const tk=tickets(),inSt=l=>l.st==='cook'&&(S.bflt==='all'||mById(l.mid).st===S.bflt);
 const rows=tk.filter(o=>o.lines.some(inSt)).sort((a,b)=>a.t-b.t),cnt=f=>tk.filter(o=>o.lines.some(l=>l.st==='cook'&&(f==='all'||mById(l.mid).st===f))).length;
 const head=`<div class="pills">${[['all','Tất cả'],['bep','🍳 Quầy Bếp'],['bar','🍹 Quầy Bar']].map(([k,l])=>`<button class="pill ${S.bflt===k?'on':''}" onclick="S.bflt='${k}';render()">${l} (${cnt(k)})</button>`).join('')}</div>
 <div class="pills"><button class="pill ${S.bgom?'on':''}" onclick="S.bgom=!S.bgom;render()">≡ Gom theo món</button><button class="pill" onclick="openSoldOut()">⚠ Báo hết món</button><button class="pill" onclick="toast('Đã bật âm báo khi có phiếu mới')">🔊 Âm báo</button></div>`;
 if(!rows.length)return head+`<div class="card empty">${ic('chef',34)}<p style="font-weight:700;color:var(--ink2);margin-top:6px">Bếp / Bar đang trống phiếu</p><p style="font-size:13px">Khi phục vụ bấm “Báo bếp”, món mới sẽ hiển thị tự động tại đây ngay lập tức.</p></div>`;
 if(S.bgom){const g={};rows.forEach(o=>o.lines.forEach(l=>{if(inSt(l)){const x=g[l.name]||(g[l.name]={q:0,o:[]});x.q+=l.qty;x.o.push(tName(o)+(o.type==='table'?'':' '+o.code.slice(-3)))}}));
  return head+`<div class="list">${Object.entries(g).sort((a,b)=>b[1].q-a[1].q).map(([n,x])=>`<div class="row"><span class="qn">${x.q}</span><div class="tx"><b>${esc(n)}</b><span>${x.o.map(esc).join(' · ')}</span></div><button class="okb" onclick="doneName('${n.replace(/'/g,"\\'")}')" aria-label="Xong hết ${esc(n)}">${ic('check',20)}</button></div>`).join('')}</div><p class="hint">Gom các đơn cùng món để bếp nấu một lần. Bấm ✓ để xong hết món đó.</p>`}
 return head+rows.map(o=>{const late=mins(o.t)>15;return `<div class="tk ${late?'late':''}"><div class="hd"><div><span class="tbadge ${TYC[o.type]}">${tName(o)}</span> <b style="font-size:14px">${o.code.slice(-3)}</b>${o.pickAt?` <span class="chip low" style="padding:1px 8px;font-size:12px">hẹn ${esc(o.pickAt)}</span>`:''}</div><span class="tm" style="${late?'color:var(--red)':''}">${late?'⚠ ':''}${ago2(o.t)}</span></div>
  ${o.lines.map((l,k)=>inSt(l)||(l.st==='done'&&(S.bflt==='all'||mById(l.mid).st===S.bflt))?`<div class="ln ${l.st==='done'?'dn':''}"><span class="qn">${l.qty}</span><div style="flex:1;min-width:0"><b>${esc(l.name)}</b>${l.tops.length||l.note?`<div style="font-size:13px;color:var(--orange);font-weight:600">${[...l.tops.map(t=>t.name),l.note].filter(Boolean).map(esc).join(' · ')}</div>`:''}</div>${l.st==='cook'?`<button class="okb" onclick="doneL(${o.id},${k})" aria-label="Xong">${ic('check',20)}</button>`:''}</div>`:'').join('')}
  ${o.note?`<div class="ln" style="font-size:13px;color:var(--ink2)">📝 ${esc(o.note)}</div>`:''}
  <div style="padding:10px 14px"><button class="btn btn-green btn-sm" style="width:100%" onclick="doneAll(${o.id})">Xong cả phiếu</button></div></div>`}).join('')}
function doneL(id,k){if(!need('cook'))return;const o=oById(id);o.lines[k].st='done';refreshO(o);render()}
function doneAll(id){if(!need('cook'))return;const o=oById(id);o.lines.forEach(l=>{if(l.st==='cook'&&(S.bflt==='all'||mById(l.mid).st===S.bflt))l.st='done'});refreshO(o);render();toast(`Xong phiếu ${tName(o)} ${o.code.slice(-3)}`+(o.status==='ready'?(isShipT(o)?' · chờ shipper':' · báo khách lấy'):''))}
function doneName(n){if(!need('cook'))return;tickets().forEach(o=>{o.lines.forEach(l=>{if(l.st==='cook'&&l.name===n)l.st='done'});refreshO(o)});render();toast('Đã xong hết '+n)}

 <div class="acts"><button class="btn btn-ghost" onclick="closeSheet();render()">Xong</button></div>`)}
