  <div class="unitchips" style="margin-top:12px">${S.tables.map(t=>`<span class="u" style="font-size:13.5px">${esc(t.name)} <small class="muted" style="font-weight:500">(${esc(t.area)} · ${t.seats} ghế)</small><button onclick="delTable(${t.id})" aria-label="Xóa ${esc(t.name)}">${ic('x',14)}</button></span>`).join('')}</div></div>
 ${cs?vAccts(isOwner):''}
 ${isOwner||can('perm')||me().role==='mgr'?vPerm(isOwner):''}
 <div class="card"><div class="hd2"><h3>🧾 Nhật ký thao tác ${NW}</h3><span class="muted" style="font-size:13px">${S.log.length} mục</span></div><p class="rsub" style="font-size:13px">Ai hủy món, giảm giá, sửa giá, đổi quyền… đều được ghi lại, không xóa được.</p>
  ${S.log.slice(0,12).map(l=>`<div class="logr"><b>${esc(l.who)}</b> · ${esc(l.txt)}<small>${dayLabel(l.t)} ${pad(new Date(l.t).getHours())}:${pad(new Date(l.t).getMinutes())}</small></div>`).join('')}</div>
 <div class="card"><div class="hd2"><h3>🔑 Đổi mật khẩu tài khoản</h3><span class="tagu">@${esc(me().user)}</span></div>
  <input class="in" type="password" placeholder="Mật khẩu hiện tại" style="margin-top:10px" autocomplete="off"><input class="in" type="password" placeholder="Mật khẩu mới (≥ 4 ký tự)" style="margin-top:8px" autocomplete="off"><input class="in" type="password" placeholder="Nhập lại mật khẩu mới" style="margin-top:8px" autocomplete="off">
  <button class="btn btn-blue" style="margin-top:10px" onclick="toast('Bản demo: không đổi mật khẩu thật')">Cập nhật mật khẩu</button></div>
 <div class="demobox"><b>🧪 Chỉ dùng khi demo</b><p>Đưa toàn bộ về dữ liệu mẫu ban đầu để thử lại từ đầu. <b>Đây không phải tính năng chính thức</b>, app thật sẽ không có nút này.</p><button class="btn btn-sm" onclick="askReset()">↺ Reset dữ liệu mẫu</button></div>`}
function askReset(){sheet(`<h3>Reset dữ liệu mẫu?</h3><p class="sub">Mọi đơn, món, cài đặt bạn vừa bấm thử sẽ mất, app quay về như lúc mới mở.</p>
 <p class="lock">🧪 Nút này chỉ có trong bản demo để test nhiều lần, không phải tính năng chính thức.</p>
 <div class="acts"><button class="btn btn-danger" onclick="location.reload()">↺ Reset ngay</button><button class="btn btn-ghost" onclick="closeSheet()">Thôi</button></div>`)}
function permEdit(r){return me().role==='owner'||(can('perm')&&r!==me().role)}
function vPerm(isOwner){const r=S.prole,P=S.perm[r],ed=permEdit(r),acc=S.accts.find(a=>a.role===r&&a.on);
 return `<div class="card"><h3>🛡 Phân quyền theo vai trò ${NW}</h3><p class="rsub" style="font-size:13px">Chọn vai trò rồi bật / tắt từng quyền. Bật quyền nào thì vai trò đó dùng được ngay. Chủ quán luôn có toàn quyền.</p>
  <div class="pills" style="margin-top:10px">${Object.keys(S.perm).map(k=>`<button class="pill ${r===k?'on':''}" onclick="S.prole='${k}';render()">${ROLES[k]}</button>`).join('')}</div>
  ${ed?'':`<div class="lock">🔒 ${r===me().role?'Không tự chỉnh quyền cho vai trò của chính mình. Chủ quán mới chỉnh được.':'Bạn chưa được bật quyền “Chỉnh bảng phân quyền”.'}</div>`}
  ${PGROUPS.map(([g,ps])=>`<p class="gtitle" style="margin:16px 0 2px">${g}</p>${ps.map(([k,l])=>`<div class="prow"><span>${l}</span><label class="sw"><input type="checkbox" ${P[k]?'checked':''} ${ed?`onchange="setPerm('${r}','${k}',this.checked)"`:'disabled'} aria-label="${l}"><i></i></label></div>`).join('')}`).join('')}
  ${acc?`<button class="btn btn-ghost" style="margin-top:14px" onclick="switchMe(${acc.id})">👁 Xem thử bằng tài khoản ${esc(acc.name)}</button>`:''}</div>`}
function setPerm(r,k,v){if(!permEdit(r)){toast('Bạn không chỉnh được quyền của vai trò này','err');render();return}S.perm[r][k]=v?1:0;logA(`${v?'Bật':'Tắt'} quyền “${PERMS.find(p=>p[0]===k)[1]}” của ${ROLES[r]}`);render();toast('Đã lưu quyền')}
function saveCfg(){const c=S.cfg,g=k=>{const e=$('#cf-'+k);return e?e.value.trim():c[k]};
 ['name','phone','addr','wifi','bye','lat','lng'].forEach(k=>c[k]=g(k));if(can('bank')){const old=c.acc;['bank','acc','accName'].forEach(k=>c[k]=g(k));if(old!==c.acc)logA('Đổi số tài khoản nhận tiền')}
 ['km0','fee0','feeKm','ctv','gt'].forEach(k=>c[k]=+g(k)||0);render();toast('Đã lưu cài đặt')}
function addArea(){const v=$('#ar-n').value.trim();if(!v){toast('Gõ tên khu vực','err');return}if(S.areas.includes(v)){toast('Khu vực đã có','err');return}S.areas.push(v);render();toast('Đã thêm khu vực '+v)}
function addTable(){const n=$('#tb-n').value.trim();if(!n){toast('Gõ tên bàn','err');return}S.tables.push({id:Math.max(0,...S.tables.map(t=>t.id))+1,name:n,area:$('#tb-a').value,seats:Math.max(1,+$('#tb-s').value||4)});render();toast('Đã thêm '+n)}
function delTable(id){if(S.orders.some(o=>o.type==='table'&&o.table===id&&o.status==='open')){toast('Bàn đang có khách, chưa xóa được','err');return}if(S.cd!=='t'+id){S.cd='t'+id;toast('Bấm ✕ lần nữa để xóa bàn','err');return}S.tables=S.tables.filter(t=>t.id!==id);S.cd=null;render()}
function delAcct(id){const a=S.accts.find(x=>x.id===id);if(a.role==='owner'&&me().role!=='owner'){toast('Không thể xóa tài khoản Chủ quán','err');return}
 if(S.cd!=='a'+id){S.cd='a'+id;toast('Bấm ✕ lần nữa để xóa '+a.name+' (nên dùng Khóa thay vì xóa)','err');return}S.accts=S.accts.filter(x=>x.id!==id);logA('Xóa tài khoản '+a.name);S.cd=null;render()}
function fakeOnline(){const o=newOrder('online',{cust:{name:'Khách online',phone:'0933 777 888',addr:'Cổng ĐH Quốc gia, Hòa Lạc'},ship:{km:2.2,fee:shipFee(2.2),pay:'bank'}});o.lines=[mkLine(1,1,'new'),mkLine(16,1,'new')];render();toast('Giả lập: có 1 đơn khách tự đặt — xem ở mục Giao hàng')}

buildPos();render(false);window.__ok=true;
</script>
</body>
</html>
