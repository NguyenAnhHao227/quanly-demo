<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Kho – Ăn Ngon Hoà Lạc (Demo v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;
  --blue:#0a84ff;--blue-soft:#eaf4ff;--orange:#ff4d00;--orange-soft:#fff1e8;
  --green:#059669;--green-soft:#e6f7f0;--red:#e11d48;--red-soft:#fff0f3;--amber:#b45309;--amber-soft:#fff5dc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:#e2e8f0;color:var(--ink);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
input,select{font:inherit;font-size:16px;color:inherit}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)}

.phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(15,23,42,.12)}

/* ===== thanh trên cùng giống app POS ===== */
.pos{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.pos .r1{display:flex;align-items:center;gap:7px;padding:6px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-size:19px;flex:none}
.pos .t{flex:1;min-width:0}
.pos .t b{display:block;font-size:14.5px;line-height:1.15}
.pos .t small{color:var(--green);font-size:11px;font-weight:500;display:flex;gap:4px;align-items:center;white-space:nowrap}
.notify{background:#ffb48a;color:#fff;border-radius:99px;padding:0 10px;min-height:32px;font-weight:800;font-size:12px;display:flex;gap:4px;align-items:center;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#eef2f7;display:grid;place-items:center;flex:none;color:var(--ink2)}
.pos .r1 .iconbtn{width:32px;height:32px;border-radius:10px}
.pos .nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:3px 6px 5px;gap:0;border-top:1px solid #f1f5f9}
.pos .nav::-webkit-scrollbar{display:none}
.pos .nav button{flex:none;padding:4px 9px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;line-height:1.25}
.pos .nav button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.rep .page{padding:12px 12px 40px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.rcard h2{font-size:21px;letter-spacing:-.3px}
.rcard h3{font-size:17px;font-weight:800}
.rsub{color:var(--muted);font-size:14.5px;margin-top:4px}
.rpills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rp{background:#eef2f7;border-radius:99px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.rp.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.rdate{display:flex;align-items:center;gap:8px;background:#eef2f7;border-radius:99px;padding:10px 14px;margin-top:12px;font-size:14.5px;color:var(--ink2);flex-wrap:wrap}
.rkpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;min-height:108px;min-width:0}
.rk .l{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;color:var(--muted);font-size:14px}
.rk .v{font-size:clamp(19px,5.6vw,27px);font-weight:800;margin:6px 0 2px;letter-spacing:-.5px;white-space:nowrap}
.rk .s{color:var(--muted);font-size:13.5px}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rt{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 6px;font-weight:700;font-size:14px;text-align:center;position:relative;line-height:1.25;min-height:54px;display:flex;align-items:center;justify-content:center}
.rt.on{background:#111c33;color:#fff;border-color:#111c33}
.rt .nw{position:absolute;top:-7px;right:6px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px}
.rmuted{color:var(--muted);font-size:14.5px}
.mrow{padding:10px 0;border-bottom:1px solid #eef2f6}
.mrow:last-child{border-bottom:0}
.mrow .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.hrs{display:flex;gap:3px;align-items:flex-end;height:130px;margin-top:12px}
.hrs i{display:block;flex:1;background:#4f8df5;border-radius:4px;min-height:3px}
.hlab{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;font-size:11px;color:var(--muted);margin-top:6px}
.hlab span{text-align:center;white-space:nowrap}
.rank{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f6}
.rank:last-child{border-bottom:0}
.rank .no{width:28px;height:28px;border-radius:9px;background:#eef2f7;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rank .tx{flex:1;min-width:0}
.rank .tx b{display:block;font-size:15px}
.rank .tx span{font-size:13px;color:var(--muted)}
.dchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.dchip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:none}
.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
.rrow{padding:14px 0;border-bottom:1px solid #eef2f6}
.rrow:last-of-type{border-bottom:0}
.rrow b{font-size:16px}
.rrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rrow .inl{display:flex;gap:10px;align-items:center;margin-top:8px}
.rrow .inl .in{flex:1}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eef2f6}
.pl.tot{font-weight:800;font-size:17px}
.pl small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#eef2f7;margin:12px 0 8px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;gap:5px;align-items:center}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.fold-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.fold-h h3{font-size:17px}
.fsum{display:flex;align-items:center;gap:8px;flex:none}
.chv{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#eef2f7;color:var(--ink2);transition:transform .2s}
.chv.open{transform:rotate(180deg)}
.fold-b{margin-top:12px}
.srow .fold-h{padding:2px 0}
.srow{padding:12px 0;border-bottom:1px solid #eef2f6}
.srow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.srow .fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.sday{display:grid;grid-template-columns:1fr 78px 86px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f6}
.sday:last-child{border-bottom:0}
.sday .in{min-height:42px;text-align:center;padding:0 6px}
.phone.rep .tabbar:empty,.tabbar:empty{display:none}
.ktitle{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.ktitle:empty{display:none}
.ktitle b{font-size:21px;letter-spacing:-.3px;flex:1}
.ktitle .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}

.page{padding:14px 16px 120px}
.page>*+*{margin-top:14px}
.demo{font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid #f6d68a;border-radius:12px;padding:8px 12px;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3,.sec h3{font-size:16px;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hello h2{font-size:22px;letter-spacing:-.3px}
.hello p{color:var(--muted);font-size:13px;font-weight:600}

.btn{min-height:50px;border-radius:14px;padding:0 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(10,132,255,.25)}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 6px 14px rgba(255,77,0,.22)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{min-height:40px;font-size:14px;padding:0 14px;width:auto;border-radius:12px}
.btn[disabled]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{color:var(--blue);font-weight:700;font-size:14px;padding:6px 0}

.hero{background:linear-gradient(135deg,#0a84ff,#2563eb);color:#fff;border:0}
.hero .n{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.hero p{opacity:.9;font-size:14px;margin-top:2px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.hero .chips span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.hero .btn{background:#fff;color:var(--blue);box-shadow:none}
.hero.ok{background:linear-gradient(135deg,#10b981,#059669)}
.hero.ok .btn{color:var(--green)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:19px;font-weight:800;margin-top:2px}

.act{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:84px;width:100%}
.act .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.act b{font-size:14.5px}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-green{background:var(--green-soft);color:var(--green)}.t-orange{background:var(--orange-soft);color:var(--orange)}
.t-red{background:var(--red-soft);color:var(--red)}.t-amber{background:var(--amber-soft);color:var(--amber)}.t-gray{background:#f1f5f9;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}.chip.low{background:var(--amber-soft);color:var(--amber)}.chip.out{background:var(--red-soft);color:var(--red)}.chip.gray{background:#f1f5f9;color:var(--muted)}.chip.auto{background:var(--blue-soft);color:var(--blue);padding:2px 8px;font-size:12px}

.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #eef2f6;width:100%;text-align:left;min-height:60px}
.row:last-child{border-bottom:0}
button.row:active{background:#f8fafc}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px}
.row .tx span{color:var(--muted);font-size:13.5px}
.row .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}

.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14.5px;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--muted);flex:1;min-height:48px}
.search input{border:0;outline:0;width:100%;background:transparent;color:var(--ink)}
.sbar{display:flex;gap:10px}
.addbtn{width:48px;height:48px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}

.seg{display:flex;gap:8px}
.sg{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 6px;font-weight:700;color:var(--muted);font-size:15px}
.sg.s{padding:9px 4px;font-size:13.5px}
.sg.ok.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.sg.low.on{background:var(--amber-soft);border-color:#f59e0b;color:var(--amber)}
.sg.out.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.sg.on.plain{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}

label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.in{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
.frow{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.radios{display:flex;gap:8px}
.radios label{flex:1;margin:0;border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.radios input{display:none}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}

/* công tắc */
.sw{position:relative;display:inline-block;width:54px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:before{transform:translateX(22px)}
.sw input:focus-visible+i{outline:3px solid rgba(10,132,255,.4)}
.swrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.swrow b{font-size:15px}
.swrow span{display:block;font-size:13px;color:var(--muted);font-weight:400}

.group{margin-bottom:14px}
.group h4{font-size:14px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:center}
.group h4 small{font-weight:500;color:var(--muted)}
.qin{display:flex;align-items:center;gap:6px}
.qin input{width:68px;min-height:42px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-weight:700;outline:none}
.qin span{font-size:13.5px;color:var(--muted);min-width:34px}
.stepper{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;height:50px}
.stepper button{width:46px;background:#f8fafc;font-weight:800;font-size:20px}
.stepper input{width:56px;border:0;text-align:center;outline:0;font-weight:700}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 12px}
.daytitle{font-size:13px;font-weight:800;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.unitchips{display:flex;gap:8px;flex-wrap:wrap}
.unitchips .u{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 8px 8px 16px;font-weight:700}
.unitchips .u button{width:26px;height:26px;border-radius:99px;background:#f1f5f9;display:grid;place-items:center;color:var(--muted)}
.neg{color:var(--red);font-weight:700}
.gtitle{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 4px 8px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px;position:relative}
.tabbar button.on{color:var(--blue)}
.tabbar .b{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#cbd5e1;margin:4px auto 12px}
.sheet h3{font-size:19px;margin-bottom:2px}
.sheet .sub{color:var(--muted);font-size:14px}
.sheet .acts{margin-top:18px;display:grid;gap:10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;width:calc(100% - 32px);max-width:440px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 12px 30px rgba(15,23,42,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#34d399}.toast.err svg{color:#fda4af}
.view{animation:fade .2s}
</style>
</head>
<body>
<div class="phone">
  <header class="pos" id="pos"></header>
  <div class="ktitle" id="ktitle"></div>
  <main class="page view" id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="Điều hướng kho"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ===== icons ===== */
const ICONS={
 home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 pkg:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
 cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
 dots:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',

 <div class="tiles"><div class="tile"><span>Đã chi mua hàng hôm nay</span><b>${spent?money(spent):'—'}</b></div><div class="tile"><span>Đang nợ nhà cung cấp</span><b>${money(debt)}</b></div></div>
 <div class="two">
  <button class="act" onclick="arrivedBlank()"><span class="ico t-green">${ic('down',20)}</span><b>Ghi hàng về</b></button>
  <button class="act" onclick="setTab('more','count')"><span class="ico t-blue">${ic('tick',20)}</span><b>Kiểm nhanh kho</b></button>
 </div>
 <div class="card"><h3>${ic('bolt',16)} Thử: khách mua hàng</h3>
  <p class="muted" style="font-size:14px;margin-top:2px">Món nào bật <b>“Tự trừ khi bán”</b> sẽ tự giảm kho khi khách thanh toán. Thịt cá rau không bị trừ.</p>
  ${autos.length?`<label class="l" for="sim-item">Khách mua</label><select id="sim-item" class="in" onchange="S.simItem=+this.value">${autos.map(i=>`<option value="${i.id}" ${i.id===S.simItem?'selected':''}>${esc(i.name)} — còn ${num(i.amt)} ${esc(i.unit)}</option>`).join('')}</select>
  <div style="display:flex;gap:10px;margin-top:12px"><div class="stepper"><button onclick="simQ(-1)" aria-label="Giảm">−</button><input id="sim-q" type="number" min="1" value="${S.simQty}" aria-label="Số lượng" onchange="S.simQty=Math.max(1,Math.floor(+this.value)||1);render()"><button onclick="simQ(1)" aria-label="Tăng">+</button></div><button class="btn btn-blue" onclick="simSell()">Bán & trừ kho</button></div>`
  :'<div class="empty" style="padding:14px">Chưa có món nào bật “Tự trừ khi bán”</div>'}
  <button class="link" onclick="setTab('more','auto')">Chọn món nào tự trừ →</button></div>`}
function simQ(d){S.simQty=Math.max(1,S.simQty+d);render()}
function simSell(){const i=it(S.simItem),q=S.simQty;if(!i)return;
 if(i.amt<q){toast(`Kho chỉ còn ${num(i.amt)} ${i.unit} ${i.name}, không đủ để bán ${q}`,'err');return}
 const b=i.lv;i.amt-=q;refresh(i);render();
 toast(`Đã bán ${q} ${i.unit} ${i.name} — kho còn ${num(i.amt)}`+(b==='ok'&&i.lv!=='ok'?` · ⚠ ${i.lv==='out'?'hết hàng':'sắp hết'}`:''))}

/* ===== KHO ===== */
function filtered(){const q=S.q.trim().toLowerCase();let rows=S.items.filter(i=>(S.flt==='all'||i.lv===S.flt)&&(!q||i.name.toLowerCase().includes(q)));const rk={out:0,low:1,ok:2};return rows.sort((a,b)=>rk[a.lv]-rk[b.lv]||a.name.localeCompare(b.name,'vi'))}
function vStock(){
 const c={all:S.items.length,low:S.items.filter(i=>i.lv==='low').length,out:S.items.filter(i=>i.lv==='out').length};
 return `<div class="sbar"><label class="search" aria-label="Tìm món">${ic('search',18)}<input id="q" placeholder="Tìm món…" value="${esc(S.q)}" oninput="S.q=this.value;stockList()"></label><button class="addbtn" onclick="openAdd()" aria-label="Thêm món">${ic('plus',22)}</button></div>
 <div class="pills">${[['all','Tất cả'],['low','Sắp hết'],['out','Hết']].map(([k,l])=>`<button class="pill ${S.flt===k?'on':''}" onclick="S.flt='${k}';render()">${l} (${c[k]})</button>`).join('')}</div>
 <div id="stock-list">${stockHTML(filtered())}</div>
 <p class="hint">Bấm vào món để sửa tình trạng, số lượng, tên hay nhà cung cấp. Món có nhãn <span class="chip auto">tự trừ</span> thì kho tự giảm khi bán.</p>`}
function stockHTML(rows){return rows.length?`<div class="list">${rows.map(i=>`<button class="row" onclick="openItem(${i.id})"><div class="tx"><b>${esc(i.name)}</b><span>${GROUPS[i.g]} · ${amtText(i)}${i.auto?' <span class="chip auto">tự trừ</span>':''}</span></div>${chip(i)}<span class="muted">${ic('chev',18)}</span></button>`).join('')}</div>`:'<div class="card empty">Không có món nào</div>'}
function stockList(){$('#stock-list').innerHTML=stockHTML(filtered())}

/* sửa món — có công tắc tự trừ */
function openItem(id){const i=it(id);
 S.tmp={id,auto:!!i.auto,lv:i.lv,name:i.name,g:i.g,sup:i.sup,usual:i.usual??'',amt:i.amt??'',unit:i.unit,min:i.min??'',pu:i.pack?.unit||'thùng',pn:i.pack?.n||''};renderItem()}
function syncTmp(){const t=S.tmp,g=id=>document.getElementById(id);
 [['e-name','name'],['e-g','g'],['e-sup','sup'],['e-usual','usual'],['e-amt','amt'],['e-unit','unit'],['e-min','min'],['e-pu','pu'],['e-pn','pn']].forEach(([e,k])=>{const x=g(e);if(x)t[k]=k==='sup'?+x.value:x.value})}
function renderItem(){const t=S.tmp,i=it(t.id);
 sheet(`<h3>Sửa món</h3>
 <label class="l" for="e-name">Tên món</label><input id="e-name" class="in" value="${esc(t.name)}">
 <label class="l" for="e-g">Nhóm</label><select id="e-g" class="in">${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}" ${k===t.g?'selected':''}>${esc(v)}</option>`).join('')}</select>
 <div class="swrow"><div><b>Tự trừ khi bán</b><span>${t.auto?'Đang bật: khách thanh toán là kho tự giảm':'Đang tắt: bạn tự chỉnh Đủ / Sắp hết / Hết'}</span></div><label class="sw"><input type="checkbox" ${t.auto?'checked':''} onchange="tglAuto(this.checked)" aria-label="Tự trừ khi bán"><i></i></label></div>
 ${t.auto?`
  <label class="l" for="e-amt">Số đang có (đếm thực tế)</label><div class="frow"><input id="e-amt" class="in" type="number" inputmode="decimal" min="0" step="any" value="${t.amt}"><select id="e-unit" class="in">${unitOpts(t.unit)}</select></div>
  <label class="l" for="e-min">Báo “sắp hết” khi còn từ số này trở xuống</label><input id="e-min" class="in" type="number" inputmode="decimal" min="0" step="any" value="${t.min}">
  <label class="l">Quy đổi khi nhập hàng (để trống nếu không cần)</label><div class="frow"><select id="e-pu" class="in">${unitOpts(t.pu)}</select><input id="e-pn" class="in" type="number" inputmode="decimal" min="0" step="any" placeholder="= mấy ${esc(t.unit)}?" value="${t.pn}"></div>`
 :`
  <label class="l">Tình trạng hiện tại</label>${seg(t.lv,'pickLv')}
  <label class="l" for="e-amt">Còn khoảng (ước chừng)</label><div class="frow"><input id="e-amt" class="in" type="number" inputmode="decimal" min="0" step="any" placeholder="VD: 5" value="${t.amt}"><select id="e-unit" class="in">${unitOpts(t.unit)}</select></div>`}
 <label class="l" for="e-usual">Mỗi lần thường mua (${esc(t.auto&&t.pn>0?t.pu:t.unit)}) — để gợi ý đặt hàng</label><input id="e-usual" class="in" type="number" inputmode="decimal" min="0" step="any" placeholder="VD: 10" value="${t.usual}">
 <label class="l" for="e-sup">Nhà cung cấp</label><select id="e-sup" class="in">${supOpts(t.sup)}</select>
 <div class="acts"><button class="btn btn-blue" onclick="saveItem()">${ic('check',18)} Lưu</button><button class="btn btn-danger" onclick="delItem(${t.id})">Xóa món này</button><button class="btn btn-ghost" onclick="closeSheet()">Đóng</button></div>`)}
function pickLv(k,b){S.tmp.lv=k;b.parentNode.querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function tglAuto(v){syncTmp();const t=S.tmp;t.auto=v;if(v){if(t.amt===''||t.amt==null)t.amt=0;if(t.min==='')t.min=5}renderItem()}
function saveItem(){syncTmp();const t=S.tmp,i=it(t.id),name=String(t.name).trim();
 if(!name){toast('Tên món không được để trống','err');return}
 if(S.items.some(x=>x.id!==i.id&&x.name.toLowerCase()===name.toLowerCase())){toast('Đã có món trùng tên này','err');return}
 i.name=name;i.g=GROUPS[t.g]?t.g:i.g;i.sup=+t.sup;i.unit=t.unit;i.usual=t.usual===''?null:+t.usual;i.auto=t.auto;
 if(t.auto){i.amt=+t.amt||0;i.min=+t.min||0;i.pack=+t.pn>0?{unit:t.pu,n:+t.pn}:null;i.lv=calcLv(i)}
 else{i.lv=t.lv;i.amt=i.lv==='out'?null:(t.amt===''?null:+t.amt);i.pack=null}
 closeSheet();render();toast(`Đã lưu ${i.name}`)}
function delItem(id){const i=it(id);if(S.cd!=='i'+id){S.cd='i'+id;toast('Bấm “Xóa món này” thêm lần nữa để xác nhận','err');return}
 S.items=S.items.filter(x=>x.id!==id);closeSheet();render();toast(`Đã xóa ${i.name}`)}

function openAdd(){
 sheet(`<h3>Thêm món vào kho</h3><p class="sub">Chỉ cần tên và đơn vị, còn lại sửa sau cũng được</p>
 <label class="l" for="a-name">Tên món</label><input id="a-name" class="in" placeholder="VD: Mực ống">
 <div class="frow"><div><label class="l" for="a-unit">Đơn vị</label><select id="a-unit" class="in">${unitOpts('ký')}</select></div><div><label class="l" for="a-g">Nhóm</label><select id="a-g" class="in">${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
 <label class="l" for="a-sup">Nhà cung cấp</label><select id="a-sup" class="in">${supOpts(S.sups[0]?.id)}</select>
 <div class="acts"><button class="btn btn-blue" onclick="addItem()">${ic('plus',18)} Thêm</button><button class="btn btn-ghost" onclick="closeSheet()">Hủy</button></div>`)}
function addItem(){const name=$('#a-name').value.trim();if(!name){toast('Nhập tên món','err');return}
 if(S.items.some(i=>i.name.toLowerCase()===name.toLowerCase())){toast('Món này đã có trong kho','err');return}
 S.items.push({id:Math.max(0,...S.items.map(i=>i.id))+1,name,g:$('#a-g').value,unit:$('#a-unit').value,lv:'ok',amt:null,sup:+$('#a-sup').value,usual:null});closeSheet();S.q='';S.flt='all';render();toast(`Đã thêm ${name}`)}

/* ===== MUA HÀNG ===== */
function vBuy(){
 const nd=needList().length;
 return `<div class="seg"><button class="sg plain ${S.seg==='need'?'on':''}" onclick="S.seg='need';render()">Cần đặt${nd?' ('+nd+')':''}</button><button class="sg plain ${S.seg==='in'?'on':''}" onclick="S.seg='in';render()">Ghi hàng về</button></div>`+(S.seg==='need'?vNeed():vIn())}
function vNeed(){
 const list=needList();if(!list.length)return '<div class="card empty">Không có món nào cần đặt 🎉<br>Món nào bạn chuyển sang “Sắp hết” hoặc “Hết” sẽ hiện ở đây.</div>';
 const by={};list.forEach(i=>(by[i.sup]=by[i.sup]||[]).push(i));
 return Object.entries(by).map(([sid,arr])=>{const s=sp(+sid);
  return `<div class="group"><h4>${esc(s.name)}<small>${s.phone}</small></h4>
  <div class="list">${arr.map(i=>`<div class="row" style="flex-wrap:wrap"><div class="tx" style="min-width:140px"><b>${esc(i.name)}</b><span>${chip(i)} ${i.lv==='out'?'':amtText(i)}</span></div>
   <div class="qin"><input type="number" inputmode="decimal" min="0" step="any" aria-label="Số lượng đặt ${esc(i.name)}" value="${i.usual??''}" placeholder="?" oninput="it(${i.id}).usual=this.value===''?null:+this.value"><span>${esc(uUnit(i))}</span></div>
   <button class="btn btn-ghost btn-sm" onclick="arrived(${i.id})">Về rồi</button></div>`).join('')}</div>
  <div class="two" style="margin-top:10px"><button class="btn btn-ghost" onclick="copyMsg(${s.id})">${ic('copy',18)} Sao chép Zalo</button><a class="btn btn-blue" style="text-decoration:none" href="tel:${s.phone.replace(/\s/g,'')}">${ic('phone',18)} Gọi ${esc(s.short)}</a></div></div>`}).join('')}
function zaloMsg(sid){const d=new Date();return `Ngày ${pad(d.getDate())}/${pad(d.getMonth()+1)}:\n`+needList().filter(i=>i.sup===sid).map(i=>`- ${i.name}${i.usual?': '+num(i.usual)+' '+uUnit(i):''}`).join('\n')}
function copyMsg(sid){const t=zaloMsg(sid),done=()=>toast('Đã sao chép — dán vào Zalo gửi nhà cung cấp');
 const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}
function arrived(id){const i=it(id);S.buyD={name:i.name,qty:i.usual??'',unit:uUnit(i),money:'',sup:i.sup,paid:true};S.seg='in';setTab('buy')}
function arrivedBlank(){resetBuy();S.seg='in';setTab('buy')}
function buyItem(){return S.items.find(i=>i.name.toLowerCase()===S.buyD.name.trim().toLowerCase())}
function buyFactor(m){return(m.pack&&S.buyD.unit===m.pack.unit)?m.pack.n:1}
function buyHint(){const m=buyItem(),q=+S.buyD.qty;if(!m||!m.auto||!(q>0))return '';const add=q*buyFactor(m);return `Kho sẽ cộng ${num(add)} ${m.unit} → còn ${num((m.amt||0)+add)} ${m.unit}`}
function hintUpd(){const e=$('#b-hint');if(e)e.textContent=buyHint()}
function vIn(){const d=S.buyD,today=S.buys.filter(b=>isToday(b.t)),sum=today.reduce((a,b)=>a+b.money,0);
 return `<div class="card"><h3>Hôm nay mua gì?</h3><p class="muted" style="font-size:14px">Ghi như ngoài chợ: “10 ký thịt”, “20 bó rau”. Không cần cân chính xác.</p>
  <label class="l" for="b-name">Món</label><input id="b-name" class="in" list="dl" placeholder="Gõ tên hoặc chọn món" autocomplete="off" value="${esc(d.name)}" oninput="buyName(this.value)"><datalist id="dl">${S.items.map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>
  <label class="l" for="b-qty">Số lượng</label><div class="frow"><input id="b-qty" class="in" type="number" inputmode="decimal" min="0" step="any" placeholder="VD: 10" value="${d.qty}" oninput="S.buyD.qty=this.value;hintUpd()"><select id="b-unit" class="in" onchange="S.buyD.unit=this.value;hintUpd()">${unitOpts(d.unit)}</select></div>
  <div id="b-hint" style="font-size:13px;color:var(--blue);font-weight:600;margin-top:6px">${esc(buyHint())}</div>
  <label class="l" for="b-money">Tổng tiền (có thể bỏ trống)</label><input id="b-money" class="in mny" type="text" inputmode="numeric" autocomplete="off" placeholder="VD: 285.000" value="${fmtIn(d.money)}" oninput="S.buyD.money=unm(this.value)">
  <label class="l" for="b-sup">Mua của</label><select id="b-sup" class="in" onchange="S.buyD.sup=+this.value">${supOpts(d.sup)}</select>
  <label class="l">Thanh toán</label><div class="radios"><label><input type="radio" name="pd" ${d.paid?'checked':''} onchange="S.buyD.paid=true">Đã trả</label><label><input type="radio" name="pd" ${d.paid?'':'checked'} onchange="S.buyD.paid=false">Ghi nợ</label></div>
  <div style="margin-top:18px"><button class="btn btn-blue" onclick="saveBuy()">${ic('check',18)} Lưu</button></div></div>
  <div><div class="sec"><h3>Hôm nay đã mua</h3><b>${sum?money(sum):''}</b></div>
  ${today.length?`<div class="list">${today.map(buyRow).join('')}</div>`:'<div class="card empty">Chưa ghi món nào hôm nay</div>'}</div>`}
function buyRow(b){return `<div class="row"><div class="tx"><b>${esc(b.name)} · ${num(b.qty)} ${esc(b.unit)}</b><span>${esc(sp(b.sup).short)}${b.paid?'':' · <span class="neg">ghi nợ</span>'}</span></div><b>${b.money?money(b.money):'<span class="muted" style="font-weight:500">chưa ghi tiền</span>'}</b></div>`}
function buyName(v){S.buyD.name=v;const m=buyItem();if(m){S.buyD.unit=uUnit(m);S.buyD.sup=m.sup;$('#b-unit').value=S.buyD.unit;$('#b-sup').value=m.sup;if(!S.buyD.qty&&m.usual){S.buyD.qty=m.usual;$('#b-qty').value=m.usual}}hintUpd()}
function saveBuy(){const d=S.buyD,name=d.name.trim(),q=+d.qty;
 if(!name){toast('Gõ tên món đã mua','err');return}
 if(!(q>0)){toast('Ghi số lượng (ước chừng cũng được)','err');return}
 let i=buyItem();
 if(!i){i={id:Math.max(0,...S.items.map(x=>x.id))+1,name,g:'other',unit:d.unit,lv:'ok',amt:q,sup:+d.sup,usual:q};S.items.push(i)}
 else if(i.auto){i.amt=(i.amt||0)+q*buyFactor(i);refresh(i)}
 else{i.lv='ok';i.amt=q;i.unit=d.unit;if(!i.usual)i.usual=q}
 const m=+d.money||0;S.buys.unshift({id:++S.lid,t:Date.now(),name:i.name,qty:q,unit:d.unit,money:m,sup:+d.sup,paid:d.paid});
 if(!d.paid&&m&&S.sups.some(s=>s.id===+d.sup))sp(+d.sup).debt+=m;resetBuy();render();toast(`Đã ghi: ${i.name} ${num(q)} ${d.unit}${m?' · '+money(m):''}`)}

/* ===== THÊM ===== */
function vMore(){
 if(S.sub==='sup')return vSup();if(S.sub==='auto')return vAuto();if(S.sub==='groups')return vGroups();if(S.sub==='units')return vUnits();if(S.sub==='hist')return vHist();if(S.sub==='count')return vCount();
 const R=(i,t,s,tone,sub)=>`<button class="row" onclick="setTab('more','${sub}')"><span class="ico t-${tone}">${ic(i,20)}</span><div class="tx"><b>${t}</b><span>${s}</span></div><span class="muted">${ic('chev',18)}</span></button>`;
 const n=S.items.filter(i=>i.auto).length;
 return `<div class="list">
  ${R('bolt','Hàng bán lẻ (tự trừ)',`Bật / tắt món nào tự trừ khi bán · đang bật ${n} món`,'green','auto')}
  ${R('users','Nhà cung cấp',S.sups.length+' nhà cung cấp · sửa, gọi, trả nợ','blue','sup')}
  ${R('tick','Kiểm nhanh kho','Đi một vòng, chọn Đủ / Sắp hết / Hết','amber','count')}
  ${R('pkg','Nhóm hàng','Thịt cá, rau củ, đồ uống… tự đặt tên nhóm','blue','groups')}
  ${R('tag','Đơn vị tính','Thêm “ký, bó, bắp, thùng…” theo cách quán hay dùng','orange','units')}
  ${R('hist','Lịch sử mua hàng','Xem lại đã mua gì, bao nhiêu tiền','gray','hist')}
 </div>`}

/* màn hình bật / tắt tự trừ */
function vAuto(){const n=S.items.filter(i=>i.auto).length;
 const order=[...new Set(['drink','other','meat','veg',...Object.keys(GROUPS)])].filter(g=>GROUPS[g]);
 return `<div class="hint">Bật công tắc ở món nào thì <b>khi khách thanh toán, kho tự trừ món đó</b>. Thường bật cho nước, bia, đồ bán lẻ. Thịt, cá, rau để tắt: bạn tự chỉnh Đủ / Sắp hết / Hết.</div>
 <div class="tiles"><div class="tile"><span>Đang tự trừ</span><b>${n} món</b></div><div class="tile"><span>Bạn tự chỉnh</span><b>${S.items.length-n} món</b></div></div>`
 +order.map(g=>{const rows=S.items.filter(i=>i.g===g);if(!rows.length)return '';
  return `<div><div class="gtitle">${GROUPS[g]}</div><div class="list">${rows.map(i=>`<div class="row"><div class="tx"><b>${esc(i.name)}</b><span>${i.auto?`<span class="chip auto">tự trừ</span> còn ${num(i.amt)} ${esc(i.unit)}`:'bạn tự chỉnh tình trạng'}</span></div><label class="sw"><input type="checkbox" ${i.auto?'checked':''} onchange="tglItem(${i.id},this.checked)" aria-label="Tự trừ ${esc(i.name)}"><i></i></label></div>`).join('')}</div></div>`}).join('')}
function tglItem(id,on){const i=it(id);i.auto=on;
 if(on){if(i.amt==null)i.amt=0;if(i.min==null)i.min=5;refresh(i);toast(i.amt?`Đã bật tự trừ cho ${i.name}`:`Đã bật tự trừ cho ${i.name} — vào Kho nhập số đang có`)}

function rng(seed){let s=seed;return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296}
const MENU=[['Gà ta nướng mật ong',420000],['Lẩu bò nhúng dấm',399000],['Cá chép rán giòn',280000],['Tôm sú rang muối',290000],['Sườn nướng BBQ',180000],['Rau muống xào tỏi',60000],['Cơm chiên trứng',55000],['Bia Hà Nội',30000],['Bia Tiger',36000],['Coca-Cola',20000],['Nước suối',10000]];
const TABLES=['Bàn 01','Bàn 02','Bàn 03','Bàn 04','Bàn 05','Bàn 06','Bàn 07','Bàn 08','Bàn 09','Bàn 10','Sân 1','Sân 2','Sân 3','Sân 4','Mang về'];
const METHODS={cash:'Tiền mặt',bank:'Chuyển khoản',wallet:'Ví điện tử'};
const INV=[];
(function(){const r=rng(20261117);
 for(let d=0;d<7;d++){const n=d===0?13:12+Math.floor(r()*5);
  for(let k=0;k<n;k++){const lunch=r()<.4,hour=lunch?11+Math.floor(r()*3):17+Math.floor(r()*5),nl=3+Math.floor(r()*3),used=new Set(),lines=[];
   while(lines.length<nl){const m=Math.floor(r()*MENU.length);if(used.has(m))continue;used.add(m);const p=MENU[m][1];lines.push({name:MENU[m][0],price:p,qty:p>=250000?1:1+Math.floor(r()*4)})}
   const x=r();INV.push({day:d,hour,min:Math.floor(r()*60),table:TABLES[Math.floor(r()*TABLES.length)],lines,amount:lines.reduce((a,l)=>a+l.price*l.qty,0),method:x<.35?'cash':x<.9?'bank':'wallet'})}}
 for(let d=0;d<7;d++){const dt=new Date(dayStart(d)),ds=String(dt.getFullYear()).slice(2)+pad(dt.getMonth()+1)+pad(dt.getDate());
  INV.filter(i=>i.day===d).sort((a,b)=>a.hour*60+a.min-b.hour*60-b.min).forEach((i,k)=>i.code=`HD${ds}-${String(k+1).padStart(3,'0')}`)}
})();
const CANC=[{day:0,hour:12,item:'Bia Tiger',qty:2,whole:false,reason:'Khách gọi nhầm',by:'Em Lan'},{day:1,hour:19,item:'Lẩu bò nhúng dấm',qty:1,whole:true,reason:'Khách đổi ý, chưa nấu',by:'Em Hà'},{day:3,hour:20,item:'Cá chép rán giòn',qty:1,whole:false,reason:'Món ra chậm, khách không chờ',by:'Chị Thu'}];
const PERS={today:[0],yday:[1],w7:[0,1,2,3,4,5,6]},PNAME={today:'Hôm nay',yday:'Hôm qua',w7:'7 ngày'};
const inP=d=>PERS[S.per].includes(d);
const sumA=a=>a.reduce((x,y)=>x+y,0);
const fmtD=d=>{const x=new Date(dayStart(d));return pad(x.getMonth()+1)+'/'+pad(x.getDate())+'/'+x.getFullYear()};
const dayLabelOff=d=>d===0?'Hôm nay':d===1?'Hôm qua':(x=>pad(x.getDate())+'/'+pad(x.getMonth()+1))(new Date(dayStart(d)));
const nhapHang=()=>sumA(S.buys.filter(b=>inP(dayOff(b.t))).map(b=>b.money));
const hhmm=i=>pad(i.hour)+':'+pad(i.min);
/* đối soát: dữ liệu mẫu cho các ngày đã chốt */
(function(){for(let d=1;d<=6;d++){const st=dayStat(d),bad=d===2;S.rec[d]={act:{cash:String(st.cash-(bad?150000:0)),bank:String(st.bank),wallet:String(st.wallet)},out:'0',note:bad?'Thu ngân thối nhầm tiền khách':'',done:{t:dayAt(d,23),by:'mozart227',diff:bad?-150000:0}}}})();
function dayStat(d){const o={net:0,cash:0,bank:0,wallet:0,n:0};INV.forEach(i=>{if(i.day===d){o.net+=i.amount;o[i.method]+=i.amount;o.n++}});return o}

function vOver(inv,net){

 const top=Object.entries(agg).sort((a,b)=>b[1].m-a[1].m).slice(0,6),tm=top[0]?top[0][1].m:1;
 const pay=net?Object.entries(pm).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="mrow"><div class="top"><span>${METHODS[k]}</span><span>${money(v)} · ${Math.round(v/net*100)}%</span></div><div class="bar"><i style="width:${v/net*100}%"></i></div></div>`).join(''):'<p class="rmuted">Chưa có giao dịch nào.</p>';
 const hrs=`<div class="hrs">${hr.map(v=>`<i style="height:${v?Math.max(4,v/mx*100):3}%;${v?'':'opacity:.4'}" title="${money(v)}"></i>`).join('')}</div><div class="hlab">${hr.map((_,k)=>`<span>${k%3===0?(6+k)+'h':''}</span>`).join('')}</div>`;
 const tp=top.length?top.map(([nm,a],k)=>`<div class="rank"><span class="no">${k+1}</span><div class="tx"><b>${esc(nm)}</b><span>${a.q} phần · ${money(a.m)}</span><div class="bar" style="margin-top:6px"><i style="width:${a.m/tm*100}%"></i></div></div></div>`).join(''):'<p class="rmuted">Chưa có dữ liệu món bán ra.</p>';
 return fold('pay',true,'Theo phương thức thanh toán','',pay)+fold('hrs',false,'Doanh thu theo khung giờ','',hrs)+fold('top',true,'Top món bán chạy','',tp)}

 <p class="rmuted" style="font-size:13.5px">7 ngày qua: đã chốt ${closed.length}/7 ngày${bad.length?` · <b style="color:var(--red)">${bad.length} ngày lệch</b>`:''}</p>
 <div class="rcard"><h3>Đối soát ${dayLabelOff(d)} · ${fmtD(d)}</h3><p class="rsub">Phần mềm ghi nhận <b>${money(c.st.net)}</b> từ ${c.st.n} hóa đơn</p>
  ${done?`<div class="demo" style="margin-top:12px;background:${Math.abs(done.diff)<1?'var(--green-soft)':'var(--red-soft)'};color:${Math.abs(done.diff)<1?'var(--green)':'var(--red)'};border-color:transparent">Đã chốt lúc ${pad(new Date(done.t).getHours())}:${pad(new Date(done.t).getMinutes())} bởi ${esc(done.by)} · ${Math.abs(done.diff)<1?'khớp 100%':(done.diff<0?'thiếu ':'thừa ')+money(Math.abs(done.diff))}</div>`:''}
  ${M.map(([m,nm,hint])=>`<div class="rrow"><b>${nm}</b><small>${hint}</small><small>Phần mềm ghi: ${money(c.st[m])}${m==='cash'?` · <span id="rx-cash">cần có: ${money(c.res.cash.exp)}</span>`:''}</small>
   <div class="inl"><input id="ra-${m}" class="in mny" type="text" inputmode="numeric" autocomplete="off" placeholder="Số thực nhận" value="${fmtIn(r.act[m])}" ${dis} oninput="recIn(${d},'${m}',unm(this.value))" aria-label="Thực nhận ${nm}"><span id="rd-${m}">${dChip(c.res[m].diff)}</span></div></div>`).join('')}
  <div class="rrow"><b>Đã chi từ két trong ngày</b><small>Mua hàng lặt vặt, ứng lương… lấy từ tiền mặt. Số này được trừ khỏi tiền mặt cần có.</small>
   <div class="inl"><input id="ro" class="in mny" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="${fmtIn(r.out)}" ${dis} oninput="recOut(${d},unm(this.value))" aria-label="Đã chi từ két"></div></div>
  <div class="rrow"><b>Ghi chú</b><div class="inl"><input class="in" placeholder="VD: thối nhầm tiền khách" value="${esc(r.note)}" ${dis} oninput="recOf(${d}).note=this.value" aria-label="Ghi chú đối soát"></div></div>
  <div style="background:#f8fafc;border-radius:14px;padding:12px 14px;margin-top:6px">
   <div class="pl" style="padding:6px 0;border:0"><span>Tiền cần có</span><b id="rt-need">${money(c.need)}</b></div>
   <div class="pl" style="padding:6px 0;border:0"><span>Thực nhận</span><b id="rt-act">${money(c.act)}</b></div>
   <div class="pl" style="padding:6px 0;border:0"><span>Chênh lệch</span><span id="rt-diff">${c.complete?dChip(c.diff):'<span class="chip gray">Chưa nhập đủ</span>'}</span></div></div>
  <div class="acts" style="margin-top:14px;display:grid;gap:10px">${done?`<button class="btn btn-ghost" onclick="recOpen(${d})">Mở lại để sửa</button>`:`<button class="btn btn-blue" onclick="recClose(${d})">${ic('check',18)} Chốt đối soát</button>`}</div></div>`}
function recIn(d,m,v){recOf(d).act[m]=v;recUpd(d)}
function recOut(d,v){recOf(d).out=v;recUpd(d)}
function recUpd(d){const c=recCalc(d);for(const m of ['cash','bank','wallet']){const e=$('#rd-'+m);if(e)e.innerHTML=dChip(c.res[m].diff)}
 const x=$('#rx-cash');if(x)x.textContent='cần có: '+money(c.res.cash.exp);
 $('#rt-need').textContent=money(c.need);$('#rt-act').textContent=money(c.act);$('#rt-diff').innerHTML=c.complete?dChip(c.diff):'<span class="chip gray">Chưa nhập đủ</span>'}
function recClose(d){const c=recCalc(d);if(!c.complete){toast('Nhập đủ số thực nhận cho từng mục có doanh thu','err');return}
 c.r.done={t:Date.now(),by:'mozart227',diff:c.diff};render();toast(Math.abs(c.diff)<1?'Đã chốt: khớp 100%':`Đã chốt: ${c.diff<0?'thiếu':'thừa'} ${money(Math.abs(c.diff))}`)}
function recOpen(d){recOf(d).done=null;render()}

/* ----- LÃI LỖ: doanh thu − nhập hàng − nhân viên − chi phí khác (khoản nào cũng tự chỉnh được) ----- */
const PDAYS=()=>PERS[S.per].length;
const PAYT={hour:'Theo giờ',day:'Theo ngày',month:'Theo tháng'};
const PAYL={hour:['Lương / giờ (đ)','Giờ làm'],day:['Lương / ngày (đ)','Ngày công'],month:['Lương / tháng (đ)','Số ngày']};
const EXPT={month:'mỗi tháng',day:'mỗi ngày'};
function staffPay(s){const q=S.sdays[S.per][s.id]||0;return s.type==='month'?s.rate/30*PDAYS():s.rate*q}
function expPay(e){return e.type==='day'?e.rate*PDAYS():e.rate/30*PDAYS()}
const staffCost=()=>sumA(S.staff.map(staffPay));
const expCost=()=>sumA(S.exps.map(expPay));
function vPL(){
 const net=sumA(INV.filter(i=>inP(i.day)).map(i=>i.amount)),nh=nhapHang(),sc=staffCost(),ot=expCost(),gp=net-nh,rem=gp-sc-ot;
 const debt=sumA(S.buys.filter(b=>inP(dayOff(b.t))&&!b.paid).map(b=>b.money)),pc=v=>net?Math.round(v/net*100):0;
 const seg=[[nh,'#ff7a2f','Nhập hàng'],[sc,'#0a84ff','Nhân viên'],[ot,'#94a3b8','Chi phí khác'],[Math.max(rem,0),'#059669','Còn lại']],tot=Math.max(net,nh+sc+ot,1);
 const per=PNAME[S.per].toLowerCase();
 const person=s=>{const q=S.sdays[S.per][s.id]||0,L=PAYL[s.type],o=isOpen('s'+s.id,false);
  return `<div class="srow"><button class="fold-h" onclick="tgl('s${s.id}',false)" aria-expanded="${o}"><div><b style="font-size:15.5px">${esc(s.name)}</b><small style="display:block;color:var(--muted);font-size:12.5px">${esc(s.role)} · ${PAYT[s.type].toLowerCase()}</small></div><span class="fsum"><b style="font-size:15px">${money(staffPay(s))}</b><i class="chv ${o?'open':''}">${ic('chevd',18)}</i></span></button>
  ${o?`<div class="two" style="gap:8px;margin-top:10px"><div><span class="fl">${L[0]}</span><input class="in mny" style="min-height:44px" type="text" inputmode="numeric" autocomplete="off" value="${fmtIn(s.rate)}" onchange="setRate(${s.id},unm(this.value))" aria-label="${L[0]} ${esc(s.name)}"></div>
  <div><span class="fl">${L[1]}</span>${s.type==='month'?`<input class="in" style="min-height:44px" value="${PDAYS()} (tự tính)" disabled aria-label="Số ngày tự tính">`:`<input class="in" style="min-height:44px" type="number" inputmode="decimal" min="0" step="0.5" value="${q}" onchange="setHours(${s.id},this.value)" aria-label="${L[1]} ${esc(s.name)}">`}</div></div>
  <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="openStaff(${s.id})">${ic('edit',14)} Sửa lương / thông tin</button>`:''}</div>`};
 const staffBody=`<p class="rsub" style="margin:0 0 6px;font-size:13.5px">Mỗi người tự chọn cách tính lương: theo giờ, theo ngày hoặc theo tháng. Bấm vào tên để nhập số giờ / ngày làm trong ${per}.</p>
  <div style="display:flex;gap:16px;margin:4px 0"><button class="link" onclick="foldStaff(true)">Mở hết</button><button class="link" onclick="foldStaff(false)">Gọn hết</button></div>
  ${S.staff.map(person).join('')}
  <div style="margin-top:12px"><button class="btn btn-ghost" onclick="openStaff(null)">${ic('plus',18)} Thêm nhân viên</button></div>`;
 const expBody=`<p class="rsub" style="margin:0 0 4px;font-size:13.5px">Điện, nước, mặt bằng, internet… Thêm bao nhiêu khoản cũng được, mỗi khoản tính theo tháng hoặc theo ngày.</p>
  ${S.exps.length?S.exps.map(e=>`<div class="pl"><span><b>${esc(e.name)}</b><small>${money(e.rate)} ${EXPT[e.type]} · ${per} ≈ ${money(expPay(e))}</small></span><button class="btn btn-ghost btn-sm" onclick="openExp(${e.id})">${ic('edit',14)} Sửa</button></div>`).join(''):'<p class="rmuted" style="margin-top:10px">Chưa có khoản nào.</p>'}
  <div style="margin-top:12px"><button class="btn btn-ghost" onclick="openExp(null)">${ic('plus',18)} Thêm khoản chi</button></div>`;
 return `<div class="rcard"><h3>Kết quả kinh doanh · ${PNAME[S.per]}</h3><p class="rsub">Doanh thu trừ nhập hàng, nhân viên và chi phí khác, còn lại là tiền lời</p>
  <div class="stack">${seg.map(([v,c])=>`<i style="width:${v/tot*100}%;background:${c}"></i>`).join('')}</div>
  <div class="legend">${seg.map(([v,c,l])=>`<span><em style="background:${c}"></em>${l} ${pc(v)}%</span>`).join('')}</div>
  <div class="pl" style="margin-top:8px"><span>Doanh thu thuần</span><b style="color:var(--blue)">${money(net)}</b></div>
  <div class="pl"><span>− Nhập hàng<small>Tự lấy từ mục Kho${debt?` · trong đó ghi nợ NCC ${money(debt)}`:''}</small></span><span style="text-align:right"><b>${money(nh)}</b><br><button class="link" style="padding:0;font-size:13px" onclick="setMod('kho');setTab('more','hist')">Xem trong Kho →</button></span></div>
  <div class="pl tot"><span>= Lãi gộp</span><span style="color:${gp<0?'var(--red)':'var(--green)'}">${money(gp)}</span></div>
  <div class="pl"><span>− Nhân viên<small>${S.staff.length} người · bấm phần bên dưới để chỉnh</small></span><b>${money(sc)}</b></div>
  <div class="pl"><span>− Chi phí khác<small>${S.exps.length} khoản · bấm phần bên dưới để chỉnh</small></span><b>${money(ot)}</b></div>
  <div class="pl tot" style="border-bottom:0"><span>= Còn lại (tiền lời)<small>${pc(rem)}% doanh thu</small></span><span style="color:${rem<0?'var(--red)':'var(--green)'}">${money(rem)}</span></div></div>
 ${fold('staff',false,'Nhân viên & lương',money(sc),staffBody,S.staff.length+' người · bấm để bung ra')}
 ${fold('exp',false,'Chi phí khác',money(ot),expBody,S.exps.length+' khoản · bấm để bung ra')}
 <p class="hint">Nhập hàng lấy tự động từ mục Kho (phần Ghi hàng về). Lương, chi phí khác bạn tự đặt và sửa bất cứ lúc nào. Đây là bản demo, số chỉ để minh họa.</p>`}
function setHours(id,v){S.sdays[S.per][id]=Math.max(0,+v||0);render()}
function setRate(id,v){S.staff.find(s=>s.id===id).rate=Math.max(0,+v||0);render()}
function openStaff(id){const s=id?S.staff.find(x=>x.id===id):{name:'',role:'',type:'hour',rate:25000};
 sheet(`<h3>${id?'Sửa nhân viên':'Thêm nhân viên'}</h3>
 <label class="l" for="st-n">Tên</label><input id="st-n" class="in" placeholder="VD: Em Hương" value="${esc(s.name)}">
 <label class="l" for="st-r">Vị trí</label><input id="st-r" class="in" placeholder="VD: Phục vụ, Phụ bếp…" value="${esc(s.role)}">
 <label class="l" for="st-t">Cách tính lương</label><select id="st-t" class="in" onchange="$('#st-pl').textContent='Lương '+({hour:'mỗi giờ',day:'mỗi ngày',month:'mỗi tháng'})[this.value]+' (đ)'">${Object.entries(PAYT).map(([k,v])=>`<option value="${k}" ${k===s.type?'selected':''}>${v}</option>`).join('')}</select>
 <label class="l" for="st-p" id="st-pl">Lương ${({hour:'mỗi giờ',day:'mỗi ngày',month:'mỗi tháng'})[s.type]} (đ)</label><input id="st-p" class="in mny" type="text" inputmode="numeric" autocomplete="off" value="${fmtIn(s.rate)}">
 <p class="sub" style="margin-top:8px">Lương theo tháng sẽ tự chia đều cho 30 ngày để tính theo kỳ báo cáo.</p>
 <div class="acts"><button class="btn btn-blue" onclick="saveStaff(${id||'null'})">${ic('check',18)} ${id?'Lưu':'Thêm'}</button>${id?`<button class="btn btn-danger" onclick="delStaff(${id})">Xóa nhân viên</button>`:''}<button class="btn btn-ghost" onclick="closeSheet()">Hủy</button></div>`)}
function saveStaff(id){const n=$('#st-n').value.trim();if(!n){toast('Nhập tên nhân viên','err');return}
 const v={name:n,role:$('#st-r').value.trim()||'Nhân viên',type:$('#st-t').value,rate:Math.max(0,+unm($('#st-p').value)||0)};
 if(id)Object.assign(S.staff.find(s=>s.id===id),v);else{const nid=Math.max(0,...S.staff.map(s=>s.id))+1;S.staff.push({id:nid,...v});Object.values(S.sdays).forEach(o=>o[nid]=0)}
 closeSheet();render();toast(id?'Đã lưu thay đổi':'Đã thêm nhân viên — nhập số giờ / ngày làm bên dưới')}
function delStaff(id){if(S.cd!=='st'+id){S.cd='st'+id;toast('Bấm “Xóa nhân viên” thêm lần nữa để xác nhận','err');return}
 S.staff=S.staff.filter(s=>s.id!==id);closeSheet();render();toast('Đã xóa nhân viên')}

function openExp(id){const e=id?S.exps.find(x=>x.id===id):{name:'',type:'month',rate:0};
 sheet(`<h3>${id?'Sửa khoản chi':'Thêm khoản chi'}</h3>
 <label class="l" for="ex-n">Tên khoản</label><input id="ex-n" class="in" placeholder="VD: Internet, Gas, Rác…" value="${esc(e.name)}">
 <label class="l" for="ex-t">Tính theo</label><select id="ex-t" class="in">${Object.entries(EXPT).map(([k,v])=>`<option value="${k}" ${k===e.type?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select>
 <label class="l" for="ex-p">Số tiền (đ)</label><input id="ex-p" class="in mny" type="text" inputmode="numeric" autocomplete="off" value="${fmtIn(e.rate)}">
 <div class="acts"><button class="btn btn-blue" onclick="saveExp(${id||'null'})">${ic('check',18)} ${id?'Lưu':'Thêm'}</button>${id?`<button class="btn btn-danger" onclick="delExp(${id})">Xóa khoản này</button>`:''}<button class="btn btn-ghost" onclick="closeSheet()">Hủy</button></div>`)}
function saveExp(id){const n=$('#ex-n').value.trim();if(!n){toast('Nhập tên khoản chi','err');return}
 const v={name:n,type:$('#ex-t').value,rate:Math.max(0,+unm($('#ex-p').value)||0)};
 if(id)Object.assign(S.exps.find(x=>x.id===id),v);else S.exps.push({id:Math.max(0,...S.exps.map(x=>x.id))+1,...v});
 closeSheet();render();toast(id?'Đã lưu thay đổi':'Đã thêm khoản chi')}
function delExp(id){if(S.cd!=='ex'+id){S.cd='ex'+id;toast('Bấm “Xóa khoản này” thêm lần nữa để xác nhận','err');return}
 S.exps=S.exps.filter(x=>x.id!==id);closeSheet();render();toast('Đã xóa khoản chi')}

/* ===== NHÓM HÀNG (tự đặt) ===== */
function vGroups(){return `<p class="hint">Nhóm giúp bạn sắp xếp món trong kho. Thêm, đổi tên hay xóa theo cách quán hay gọi.</p>
 <div class="list">${Object.entries(GROUPS).map(([k,v])=>{const n=S.items.filter(i=>i.g===k).length;return `<div class="row"><div class="tx"><b>${esc(v)}</b><span>${n} món</span></div><button class="btn btn-ghost btn-sm" onclick="openGroup('${k}')">${ic('edit',14)} Sửa</button></div>`}).join('')}</div>
 <button class="btn btn-ghost" onclick="openGroup(null)">${ic('plus',18)} Thêm nhóm</button>`}
function openGroup(k){sheet(`<h3>${k?'Sửa nhóm':'Thêm nhóm'}</h3><label class="l" for="g-n">Tên nhóm</label><input id="g-n" class="in" placeholder="VD: Hải sản, Đồ khô…" value="${k?esc(GROUPS[k]):''}">
 <div class="acts"><button class="btn btn-blue" onclick="saveGroup(${k?`'${k}'`:'null'})">${ic('check',18)} ${k?'Lưu':'Thêm'}</button>${k?`<button class="btn btn-danger" onclick="delGroup('${k}')">Xóa nhóm</button>`:''}<button class="btn btn-ghost" onclick="closeSheet()">Hủy</button></div>`)}
function saveGroup(k){const v=$('#g-n').value.trim();if(!v){toast('Nhập tên nhóm','err');return}
 if(Object.entries(GROUPS).some(([x,y])=>x!==k&&y.toLowerCase()===v.toLowerCase())){toast('Đã có nhóm trùng tên này','err');return}
 GROUPS[k||'g'+Date.now()]=v;closeSheet();render();toast(k?'Đã đổi tên nhóm':'Đã thêm nhóm')}
function delGroup(k){const n=S.items.filter(i=>i.g===k).length;
 if(n){toast(`Còn ${n} món trong nhóm này — chuyển sang nhóm khác trước khi xóa`,'err');return}
 if(Object.keys(GROUPS).length<=1){toast('Cần giữ lại ít nhất 1 nhóm','err');return}
 if(S.cd!=='g'+k){S.cd='g'+k;toast('Bấm “Xóa nhóm” thêm lần nữa để xác nhận','err');return}
 delete GROUPS[k];closeSheet();render();toast('Đã xóa nhóm')}

buildPos();render(false);
</script>
</body>
</html>
